const QUESTIONS = [{"id":0,"concept":"Aim of the research","definition":"A broad statement of the purpose of the research.","tag":"Hypotheses","mc":{"question":"What is the aim of research?","options":["A specific prediction","A statistical outcome","A broad statement of purpose","An experimental error"],"correct":2},"tf":{"statement":"The aim of the research is a specific hypothesis tested by the researcher.","answer":false},"scenario":"A psychologist states their study 'seeks to explore the relationship between sleep and memory.' What is this an example of?","scenario_strength":null,"scenario_weakness":null},{"id":1,"concept":"Alternative (or experimental) hypotheses","definition":"A testable statement that a piece of research attempts to support or reject.","tag":"Hypotheses","mc":{"question":"Which of the following best defines an experimental hypothesis?","options":["A vague idea about research","A testable statement","A method of data collection","An ethical guideline"],"correct":1},"tf":{"statement":"An experimental hypothesis must be testable.","answer":true},"scenario":"A psychologist predicts 'noise will decrease concentration.' What type of hypothesis is this?","scenario_strength":null,"scenario_weakness":null},{"id":2,"concept":"Directional hypotheses","definition":"A hypothesis that suggests there will be a difference/relationship between variables, where the IV will affect the DV in one specific direction/outcome e.g. alcohol slows reaction time.","tag":"Hypotheses","mc":{"question":"What distinguishes a directional hypothesis?","options":["It is not testable","It does not predict change","It specifies the expected direction of results","It avoids assumptions"],"correct":2},"tf":{"statement":"A directional hypothesis does not predict the direction of results.","answer":false},"scenario":"A researcher states, 'people who sleep more will perform better on memory tests.' Is this a directional or non-directional hypothesis?","scenario_strength":null,"scenario_weakness":null},{"id":3,"concept":"Non-directional hypotheses","definition":"A hypothesis that suggests there will be a difference/relationship between variables, the IV will affect the DV, but does not state a specific direction/outcome for results e.g. alcohol affects reaction time.","tag":"Hypotheses","mc":{"question":"What is a key characteristic of a non-directional hypothesis?","options":["It predicts no difference","It predicts the direction of the effect","It predicts a difference without specifying direction","It is untestable"],"correct":2},"tf":{"statement":"A non-directional hypothesis predicts the specific outcome of an experiment.","answer":false},"scenario":"A researcher claims 'temperature will affect test performance.' Is this a directional or non-directional hypothesis?","scenario_strength":null,"scenario_weakness":null},{"id":4,"concept":"Null hypotheses","definition":"A hypothesis that suggests there will be no difference/relationship between variables, any that does occur does so by chance e.g. alcohol will have no effect on reaction time.","tag":"Hypotheses","mc":{"question":"What does a null hypothesis state?","options":["There is a significant relationship between variables","No effect or relationship exists","The IV causes a change in the DV","The DV causes change in the IV"],"correct":1},"tf":{"statement":"A null hypothesis claims that observed effects are due to the manipulation of the IV.","answer":false},"scenario":"If a researcher predicts 'caffeine has no effect on reaction time,' what type of hypothesis is this?","scenario_strength":null,"scenario_weakness":null},{"id":5,"concept":"Independent variables","definition":"The variable the psychologist manipulates and controls to see how it affects behaviour.","tag":"Variables","mc":{"question":"Which variable is manipulated by the psychologist?","options":["Dependent variable","Extraneous variable","Independent variable","Confounding variable"],"correct":2},"tf":{"statement":"The independent variable is the one the psychologist manipulates.","answer":true},"scenario":"In a study testing if caffeine affects memory, what is the independent variable?","scenario_strength":null,"scenario_weakness":null},{"id":6,"concept":"Dependant variables","definition":"The variable which is measured (usually the participants\u2019 behaviour) by the psychologist.","tag":"Variables","mc":{"question":"Which variable is measured by the psychologist?","options":["Independent variable","Dependent variable","Co-variable","Extraneous variable"],"correct":1},"tf":{"statement":"The dependent variable is measured by the psychologist.","answer":true},"scenario":"In an experiment measuring reaction time after caffeine intake, what is the dependent variable?","scenario_strength":null,"scenario_weakness":null},{"id":7,"concept":"Co-variables","definition":"Co-variables indicate two or more quantities being measured in a correlation by the researcher that may or may not vary with each other.","tag":"Variables","mc":{"question":"What is true of co-variables?","options":["They are always manipulated","They are only used in experiments","They may vary together in a correlation","They are irrelevant"],"correct":2},"tf":{"statement":"Co-variables are used in correlational research.","answer":true},"scenario":"If a psychologist records both screen time and sleep duration, what are these variables called?","scenario_strength":null,"scenario_weakness":null},{"id":8,"concept":"Operationalisation of variables","definition":"Giving a precise definition of the behaviour being manipulated/observed/measured (IV/DV). This allows for repetition and raises reliability as it is an agreed value that has been attributed to the measurement.","tag":"Variables","mc":{"question":"Why is operationalisation important?","options":["It ensures ethical approval","It keeps data anonymous","It allows precision and replication","It improves participant motivation"],"correct":2},"tf":{"statement":"Operational definitions help improve reliability.","answer":true},"scenario":"A researcher defines aggression as 'number of times a child hits a doll.' What is this process called?","scenario_strength":null,"scenario_weakness":null},{"id":9,"concept":"Confounding variables","definition":"Variables in a study that are not being measured or manipulated by the researcher, that affect SOME participants\u2019 behaviours but not others, having negative consequences for validity.","tag":"Variables","mc":{"question":"What do confounding variables affect?","options":["All participants equally","Only the IV","Some participants\u2019 results, harming validity","Only the control group"],"correct":2},"tf":{"statement":"Confounding variables affect some participants and reduce validity.","answer":true},"scenario":"If some participants in a memory study are tired and others are not, what is this an example of?","scenario_strength":null,"scenario_weakness":null},{"id":10,"concept":"Extraneous variables","definition":"Variables in a study that are not being measured or manipulated by the researcher but affect the results (DV) of ALL participants\u2019 behaviour equally.","tag":"Variables","mc":{"question":"What describes extraneous variables?","options":["They only affect one group","They are part of the hypothesis","They impact all participants equally","They are intentionally manipulated"],"correct":2},"tf":{"statement":"Extraneous variables affect all participants equally.","answer":true},"scenario":"In a loud testing room, all participants struggle to focus. What kind of variable is this?","scenario_strength":null,"scenario_weakness":null},{"id":11,"concept":"Internal validity","definition":"The findings are accurate and the effects on the DV are caused by the IV. Therefore, the study measures what it intends to measure (as confounding variables have been controlled and will not affect the results).","tag":"Validity","mc":{"question":"What does internal validity refer to?","options":["Generalisability","Ethical guidelines","Accuracy in measuring the intended variable","Participant enjoyment"],"correct":2},"tf":{"statement":"High internal validity means the IV caused the change in the DV.","answer":true},"scenario":"If a study has controlled all other variables and only the IV could affect the DV, what kind of validity is high?","scenario_strength":null,"scenario_weakness":null},{"id":12,"concept":"External validity","definition":"Whether the study paints a true picture of real life behaviours (e.g. if the tasks have mundane realism) and whether the findings would apply to different places, different times, or different people (population validity).","tag":"Validity","mc":{"question":"Which concept involves generalisability to real-world settings?","options":["Internal validity","Construct validity","External validity","Content validity"],"correct":2},"tf":{"statement":"External validity concerns how findings apply to other settings or people.","answer":true},"scenario":"A lab study is criticised because the task is not like real life. What type of validity is being questioned?","scenario_strength":null,"scenario_weakness":null},{"id":13,"concept":"Co-variables","definition":"Co-variables indicate two or more quantities being measured in a correlation by the researcher that may or may not vary with each other.","tag":"Variables","mc":{"question":"In correlation studies, what are co-variables?","options":["Controlled variables","Measured variables in correlation","Dependent variables","Independent variables"],"correct":1},"tf":{"statement":"Co-variables are the variables measured in a correlation study.","answer":true},"scenario":"A psychologist records sleep and anxiety scores. What are these variables called in correlation research?","scenario_strength":null,"scenario_weakness":null},{"id":14,"concept":"Operationalisation of variables","definition":"Giving a precise definition of the behaviour being manipulated/observed/measured (IV/DV). This allows for repetition and raises reliability as it is an agreed value that has been attributed to the measurement.","tag":"Variables","mc":{"question":"What does operationalising a variable involve?","options":["Guessing outcomes","Making the variable vague","Giving it a precise measurable definition","Ignoring it"],"correct":2},"tf":{"statement":"Operationalising means defining a variable in measurable terms.","answer":true},"scenario":"In a study on stress, defining 'stress' as 'heart rate increase' is an example of what?","scenario_strength":null,"scenario_weakness":null},{"id":15,"concept":"Quantitative data","definition":"A type of data that can be measured numerically by the psychologist, so that statistical analysis can be completed e.g. scores on an IQ test.","tag":"Data types","mc":{"question":"Which of the following is an example of quantitative data?","options":["Interview transcripts","IQ scores","Participant drawings","Diary entries"],"correct":1},"tf":{"statement":"Quantitative data is numerical.","answer":true},"scenario":"A study records how many errors participants make. What type of data is this?","scenario_strength":null,"scenario_weakness":null},{"id":16,"concept":"Qualitative data","definition":"A type of data that can be observed, but not measured numerically. It usually takes the form of words, thoughts and feelings, and is difficult to analyse e.g. a participant\u2019s feelings about school.","tag":"Data types","mc":{"question":"What is a feature of qualitative data?","options":["Can be analysed statistically","Always uses numbers","Is rich in detail and difficult to measure numerically","Must be from a questionnaire"],"correct":2},"tf":{"statement":"Qualitative data is usually in the form of words or themes.","answer":true},"scenario":"Interview responses describing how participants felt during a test are what type of data?","scenario_strength":null,"scenario_weakness":null},{"id":17,"concept":"Independent groups design","definition":"An experimental design where participants take part in only one experimental condition.","tag":"Research Designs","mc":{"question":"What is true of independent groups design?","options":["Participants take part in all conditions","Participants are matched across groups","Each participant is in one condition only","All participants are related"],"correct":2},"tf":{"statement":"Independent groups design uses different participants in each condition.","answer":true},"scenario":"In a study, half of the group sees images with noise, the other half without. What design is this?","scenario_strength":null,"scenario_weakness":null},{"id":18,"concept":"Repeated measures design","definition":"An experimental design where participants take part in both the control and experimental conditions.","tag":"Research Designs","mc":{"question":"Which best describes repeated measures design?","options":["Each participant is in one condition","Participants switch roles","Same participants take part in all conditions","Randomly select conditions"],"correct":2},"tf":{"statement":"In repeated measures, participants take part in all conditions.","answer":true},"scenario":"A study measures attention before and after coffee in the same group. What design is used?","scenario_strength":null,"scenario_weakness":null},{"id":19,"concept":"Matched pairs design","definition":"A form of independent groups design where the experimental and control participants are deliberately similar e.g. there is a balance between gender and IQ levels in each group/condition.","tag":"Research Designs","mc":{"question":"In matched pairs design, participants:","options":["Are randomised into groups","Take part in both conditions","Are paired on key characteristics","Choose their groups"],"correct":2},"tf":{"statement":"Matched pairs involves matching participants across groups on key traits.","answer":true},"scenario":"Two participants with similar memory ability are placed into separate groups. What design is this?","scenario_strength":null,"scenario_weakness":null},{"id":20,"concept":"Natural (quasi) experiments","definition":"A research where the experimenter has NOT deliberately manipulated the IV and participants are NOT randomly allocated. Methods within this category include natural experiments and difference studies.","tag":"Research Designs","mc":{"question":"What defines a quasi-experiment?","options":["Random allocation","Lab setting","No deliberate manipulation of IV","Blind procedures"],"correct":2},"tf":{"statement":"In quasi-experiments, the IV is not directly manipulated by the researcher.","answer":true},"scenario":"A study compares exam results before and after a school policy change. What type of experiment is this?","scenario_strength":null,"scenario_weakness":null},{"id":21,"concept":"Participant observation","definition":"A research method where the researcher takes on the role of a participant whilst observing other participants\u2019 behaviour around them.","tag":"Methodologies","mc":{"question":"In participant observation, the researcher:","options":["Is absent from the group","Watches from a distance","Joins the group being observed","Uses only surveys"],"correct":2},"tf":{"statement":"Participant observation involves the researcher being part of the group.","answer":true},"scenario":"A psychologist joins a classroom to observe student interactions. What type of observation is this?","scenario_strength":null,"scenario_weakness":null},{"id":22,"concept":"Non-participant observation","definition":"A research method where the researcher watches and records participants\u2019 behaviour without interfering in any way (from a distance).","tag":"Methodologies","mc":{"question":"What happens in non-participant observation?","options":["Researcher joins the group","Behaviour is observed from a distance","The study is unethical","Variables are manipulated"],"correct":1},"tf":{"statement":"In non-participant observation, the researcher does not get involved.","answer":true},"scenario":"A psychologist observes children playing from behind a one-way mirror. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":23,"concept":"Content analysis","definition":"A research method which involves exploration of behaviour to see what categories, codes or themes emerge, and tallying each time material fits a theme. It converts qualitative data into quantitative data so that it can be more easily compared.","tag":"Methodologies","mc":{"question":"What is the goal of content analysis?","options":["Collect surveys","Turn quantitative data into themes","Convert qualitative data into measurable categories","Make random guesses"],"correct":2},"tf":{"statement":"Content analysis involves categorising qualitative data.","answer":true},"scenario":"A researcher counts how often themes of aggression appear in TV shows. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":24,"concept":"Chi-squared test","definition":"A statistical test that is used when the experimental design is independent groups, when the level of data is nominal and when the hypothesis is predicting a difference between variables. The observed value must be higher than the critical value for results to be considered statistically significant.","tag":"Inferential Tests","mc":{"question":"When is the Chi-squared test used?","options":["Repeated measures with ordinal data","Nominal data with independent groups","Ratio data with matched pairs","Interval data with correlation"],"correct":1},"tf":{"statement":"Chi-squared is for nominal data and independent groups.","answer":true},"scenario":"A study compares preference for chocolate vs. vanilla ice cream. Which test is appropriate?","scenario_strength":null,"scenario_weakness":null},{"id":25,"concept":"Mann-Whitney U test","definition":"A statistical test that is used when the experimental design is independent groups, when the level of data is at least ordinal and when the hypothesis is predicting a difference between variables. The critical value must be higher than the observed value for results to be significant.","tag":"Inferential Tests","mc":{"question":"Which condition fits Mann-Whitney U?","options":["Nominal data and related design","Ordinal data and independent groups","Interval data and correlation","Ratio data and time sampling"],"correct":1},"tf":{"statement":"Mann-Whitney is for ordinal data with independent groups.","answer":true},"scenario":"Participants are divided into two diet groups and ranked for weight loss. Which inferential test applies?","scenario_strength":null,"scenario_weakness":null},{"id":26,"concept":"Sign test","definition":"A statistical test that is used when the experimental design is repeated measures/matched pairs, when the level of data is nominal and when the hypothesis is predicting a difference. The critical value must be higher than the observed value for results to be considered statistically significant.","tag":"Inferential Tests","mc":{"question":"Sign test is appropriate when:","options":["Data is ratio and design is independent","Data is nominal and design is repeated measures","Data is ordinal and design is unrelated","Data is interval with correlation"],"correct":1},"tf":{"statement":"The sign test is for repeated measures with nominal data.","answer":true},"scenario":"A researcher records positive or negative reactions before and after a workshop. Which test should be used?","scenario_strength":null,"scenario_weakness":null},{"id":27,"concept":"Wilcoxon matched pairs signed ranks test","definition":"A statistical test that is used when the experimental design is repeated measures/matched pairs, when the level of data is at least ordinal and when the hypothesis is predicting a difference between variables. The critical value must be higher than the observed value for results to be significant.","tag":"Inferential Tests","mc":{"question":"When is the Wilcoxon test used?","options":["Independent groups, nominal data","Matched pairs and ordinal data","Repeated measures and ratio data","Quasi-experiments only"],"correct":1},"tf":{"statement":"Wilcoxon is for repeated/matched pairs with ordinal or higher data.","answer":true},"scenario":"A study compares stress scores before and after mindfulness training using the same participants. Which test should be used?","scenario_strength":null,"scenario_weakness":null},{"id":28,"concept":"Spearman\u2019s rank order correlation coefficient","definition":"A statistical test that is used when the level of data is at least ordinal and is related, and when the hypothesis is predicting a correlation/relationship between variables. The observed value must be higher than the critical value for results to be considered statistically significant.","tag":"Inferential Tests","mc":{"question":"What does Spearman\u2019s test measure?","options":["A difference between groups","Relationship between variables","Median scores","Group variation"],"correct":1},"tf":{"statement":"Spearman\u2019s test is used for correlations with ordinal or interval data.","answer":true},"scenario":"Two variables (hours of sleep and concentration score) are ranked to test for a relationship. What test is suitable?","scenario_strength":null,"scenario_weakness":null},{"id":29,"concept":"Probability values","definition":"A numerical value that gives an indication of the likelihood that results are due to a real difference/correlation and not due to chance e.g. in psychology we accept a probability value of 95%, where results are due to chance in 5% of cases.","tag":"Inferential Tests","mc":{"question":"What does a probability value of 0.05 mean?","options":["Results are definitely wrong","There is a 5% chance results are due to error","Variables are perfectly related","Participants were randomly selected"],"correct":1},"tf":{"statement":"A p-value of 0.05 means a 5% risk of results being due to chance.","answer":true},"scenario":"A study finds p = 0.04. What does this suggest about the results?","scenario_strength":null,"scenario_weakness":null},{"id":30,"concept":"Significance levels","definition":"A numerical value that is usually expressed in value including two decimal places. This level tells you the margin of error that could occur in your results e.g. 0.05 suggests that there is a 5% possibility that results are due to chance and not the difference/correlation between variables.","tag":"Inferential Tests","mc":{"question":"What does a significance level of 0.01 suggest?","options":["1% risk of results due to chance","Results are invalid","Participants were not randomised","Researcher bias is present"],"correct":0},"tf":{"statement":"A significance level of 0.01 suggests a 1% chance results are due to luck.","answer":true},"scenario":"A psychologist sets a significance level of 0.01. What does this mean about how confident they want to be?","scenario_strength":null,"scenario_weakness":null},{"id":31,"concept":"Observed (calculated) values","definition":"The numerical value that is created as a result of inferential statistical analysis of your data. This will be compared to the critical values for the test to calculate the level of significance.","tag":"Inferential Tests","mc":{"question":"What is an observed value?","options":["A guess","A number from statistical testing","The number of participants","The hypothesis"],"correct":1},"tf":{"statement":"Observed values come from calculations on data.","answer":true},"scenario":"A Mann-Whitney test gives U = 6. What type of value is this?","scenario_strength":null,"scenario_weakness":null},{"id":32,"concept":"Critical values from tables","definition":"The tabulated numerical values that have been assigned to a particular inferential statistical test. It is compared to the observed value for your set of data to calculate significance.","tag":"Inferential Tests","mc":{"question":"Critical values help to:","options":["Select participants","Set hypotheses","Judge statistical significance","Remove bias"],"correct":2},"tf":{"statement":"Critical values determine whether results are significant.","answer":true},"scenario":"A psychologist compares their test result to a value in a statistical table. What is this value called?","scenario_strength":null,"scenario_weakness":null},{"id":34,"concept":"Mean (measure of central tendency)","definition":"The average that is shown by all scores in the data set when they are divided by n.","tag":"Descriptives","mc":{"question":"What does the mean represent?","options":["Middle value","Most frequent score","Average of all values","Total minus lowest score"],"correct":2},"tf":{"statement":"The mean is the total of all values divided by the number of values.","answer":true},"scenario":"A psychologist adds all test scores and divides by the number of participants. What measure is this?","scenario_strength":null,"scenario_weakness":null},{"id":35,"concept":"Median (measure of central tendency)","definition":"The mid-point in a set of data that has been placed in order.","tag":"Descriptives","mc":{"question":"What is the median?","options":["Most common score","Average of values","Highest score","Middle score when data is in order"],"correct":3},"tf":{"statement":"The median is the mid-point in an ordered set of values.","answer":true},"scenario":"A researcher ranks scores and selects the middle one. What is this called?","scenario_strength":null,"scenario_weakness":null},{"id":36,"concept":"Mode (measure of central tendency)","definition":"The most common value within a set of data.","tag":"Descriptives","mc":{"question":"Which value is the mode?","options":["Middle value","Largest number","Most frequently occurring number","The average"],"correct":2},"tf":{"statement":"The mode is the most frequently occurring score.","answer":true},"scenario":"A class had more students scoring 7 than any other number. What is this called?","scenario_strength":null,"scenario_weakness":null},{"id":37,"concept":"Range (measure of dispersion)","definition":"A value which shows the spread of data, representing the difference between the lowest and highest scores.","tag":"Descriptives","mc":{"question":"What does the range show?","options":["Frequency","Spread between scores","Middle value","Sum of all scores"],"correct":1},"tf":{"statement":"The range is the difference between highest and lowest values.","answer":true},"scenario":"Test scores ranged from 10 to 40. What is the range?","scenario_strength":null,"scenario_weakness":null},{"id":38,"concept":"Standard deviation (measure of dispersion)","definition":"A value which represents the amount of variation of results from the mean score.","tag":"Descriptives","mc":{"question":"What does standard deviation measure?","options":["Mean","Mode","Consistency","Spread of scores around the mean"],"correct":3},"tf":{"statement":"Standard deviation shows variation from the mean.","answer":true},"scenario":"A study shows most scores are close to the mean with a few outliers. What statistic shows this spread?","scenario_strength":null,"scenario_weakness":null},{"id":39,"concept":"Frequency tables","definition":"A chart/table which shows the rate of occurrence (frequency) for a number of measured values/categories.","tag":"Graphical Representation","mc":{"question":"What does a frequency table show?","options":["Averages","Spread","How often each value occurs","Variability over time"],"correct":2},"tf":{"statement":"A frequency table displays how often each score or category appears.","answer":true},"scenario":"A researcher tallies how many students achieved each grade. What is this called?","scenario_strength":null,"scenario_weakness":null},{"id":40,"concept":"Bar charts","definition":"A diagram that represents frequencies of non-continuous data.","tag":"Graphical Representation","mc":{"question":"What kind of data is shown in a bar chart?","options":["Continuous","Non-continuous","Correlational","Skewed"],"correct":1},"tf":{"statement":"Bar charts are used for non-continuous data like categories.","answer":true},"scenario":"A psychologist graphs responses to 'favourite subject' using separate bars. What chart is this?","scenario_strength":null,"scenario_weakness":null},{"id":41,"concept":"Line graphs","definition":"A diagram that shows a linear representation of frequencies of data.","tag":"Graphical Representation","mc":{"question":"When should you use a line graph?","options":["When comparing group means","For relationships between categories","For changes over time or conditions","For population totals"],"correct":2},"tf":{"statement":"Line graphs show trends or changes over time.","answer":true},"scenario":"A study records reaction time across 5 trials. What graph best shows this progression?","scenario_strength":null,"scenario_weakness":null},{"id":42,"concept":"Histograms","definition":"A diagram that represents the distribution of frequencies for discrete or continuous data.","tag":"Graphical Representation","mc":{"question":"Which graph is used for continuous or interval data in grouped bins?","options":["Bar chart","Pie chart","Histogram","Scatter diagram"],"correct":2},"tf":{"statement":"Histograms are used for continuous data grouped into intervals.","answer":true},"scenario":"A researcher groups test scores into intervals (e.g. 0\u201310, 11\u201320) and plots them. What graph is this?","scenario_strength":null,"scenario_weakness":null},{"id":43,"concept":"Pie charts","definition":"A diagram that represents data proportionately, as part of a whole picture of responses.","tag":"Graphical Representation","mc":{"question":"What does a pie chart represent?","options":["Trends over time","Spread of scores","Proportions of a whole","Median ranks"],"correct":2},"tf":{"statement":"A pie chart shows categories as proportional segments.","answer":true},"scenario":"A psychologist wants to show how student preferences are split among 4 course options. What chart fits best?","scenario_strength":null,"scenario_weakness":null},{"id":44,"concept":"Scatter diagrams","definition":"A diagram that represents a relationship/correlation between two or more co-variables.","tag":"Graphical Representation","mc":{"question":"Which chart displays correlation?","options":["Line graph","Scatter diagram","Pie chart","Histogram"],"correct":1},"tf":{"statement":"Scatter diagrams show relationships between two co-variables.","answer":true},"scenario":"A study looks at whether hours studied correlates with exam score. What graph should be used?","scenario_strength":null,"scenario_weakness":null},{"id":45,"concept":"Distribution curves","definition":"Linear representations of data that include a mean, median and modal score to show a spread of data.","tag":"Distributions","mc":{"question":"What do distribution curves show?","options":["Raw data tables","Causal links","Central tendency and spread","Group assignments"],"correct":2},"tf":{"statement":"Distribution curves show the shape and spread of data distributions.","answer":true},"scenario":"A psychologist plots all scores from a test and marks the average, mode and median. What is this called?","scenario_strength":null,"scenario_weakness":null},{"id":46,"concept":"Normal distribution","definition":"A type of distribution where the mean, median and mode are equal. This can be referred to as a bell curve.","tag":"Distributions","mc":{"question":"What characterises a normal distribution?","options":["Skewed data","Random noise","Mean = median = mode","Flat histogram"],"correct":2},"tf":{"statement":"In a normal distribution, mean, median and mode are equal.","answer":true},"scenario":"A psychologist plots IQ scores that form a bell curve. What is this distribution?","scenario_strength":null,"scenario_weakness":null},{"id":47,"concept":"Positive skewed distribution","definition":"A type of skewed distribution, where the mode is less than the mean.","tag":"Distributions","mc":{"question":"In a positively skewed distribution:","options":["Mean < mode","Mode < mean","All scores are equal","It's symmetrical"],"correct":1},"tf":{"statement":"In positive skew, a long tail pulls the mean to the right.","answer":true},"scenario":"A test has mostly low scores but a few very high outliers. What type of distribution is this?","scenario_strength":null,"scenario_weakness":null},{"id":48,"concept":"Negative skewed distribution","definition":"A type of skewed distribution, where the mode is greater than the mean.","tag":"Distributions","mc":{"question":"What is true of a negative skew?","options":["Mean > mode","Mode > mean","Median = mode = mean","Flat shape"],"correct":1},"tf":{"statement":"In a negative skew, the tail is to the left and the mean is lower.","answer":true},"scenario":"An exam has mostly high scores with a few very low outliers. What shape is the distribution?","scenario_strength":null,"scenario_weakness":null},{"id":49,"concept":"Confidentiality","definition":"Third parties should not be able to trace information back to individual participants. This is usually achieved through providing anonymity e.g. using participant numbers not names.","tag":"Ethics","mc":{"question":"How is confidentiality usually maintained?","options":["Using aliases","Making names public","Assigning participant numbers","Banning questions"],"correct":2},"tf":{"statement":"Confidentiality is often protected through anonymity.","answer":true},"scenario":"A psychologist stores responses using participant codes instead of names. What principle is being followed?","scenario_strength":null,"scenario_weakness":null},{"id":50,"concept":"Deception","definition":"Deliberately misleading or falsely informing participants about the nature of research.","tag":"Ethics","mc":{"question":"What does deception involve in research?","options":["Clarifying the hypothesis","Misleading participants","Openly sharing data","Giving full disclosure immediately"],"correct":1},"tf":{"statement":"Deception means not revealing the full nature of the study.","answer":true},"scenario":"A participant finds out the study was about stress but was told it was about sleep. What ethical issue is this?","scenario_strength":null,"scenario_weakness":null},{"id":51,"concept":"Risk of stress, anxiety, humiliation or pain","definition":"Research could induce more than minimal pain through repetitive or prolonged testing. Invasive testing, such as the administration of drugs, or vigorous physical exercise, would not usually be encountered in everyday life, thus is unethical.","tag":"Ethics","mc":{"question":"Which is a concern in ethical research?","options":["Asking personal opinions","Minimal discomfort","Causing lasting stress or harm","Allowing withdrawal"],"correct":2},"tf":{"statement":"Causing more than minimal psychological harm is unethical.","answer":true},"scenario":"A memory test makes participants feel distressed and ashamed. What risk is present?","scenario_strength":null,"scenario_weakness":null},{"id":52,"concept":"Risk to values, beliefs, relationships, status or privacy","definition":"Research that is likely to face this type of risk focuses on socially sensitive topics (e.g. sexuality) and includes potentially sensitive data (e.g. confidential documents).","tag":"Ethics","mc":{"question":"When is this risk most likely?","options":["In physical experiments","When asking about sensitive personal topics","With child participants only","Using questionnaires only"],"correct":1},"tf":{"statement":"Research on sensitive topics can risk privacy and beliefs.","answer":true},"scenario":"A study on addiction asks participants about past illegal behaviour. What ethical risk does this involve?","scenario_strength":null,"scenario_weakness":null},{"id":53,"concept":"Valid consent","definition":"Includes giving participants enough information (in a form they can understand) so that they can make an informed choice about whether they wish to participate.","tag":"Ethics","mc":{"question":"What does valid consent require?","options":["Signing a form without explanation","Participant understanding and agreement","Group approval only","Coercion"],"correct":1},"tf":{"statement":"Valid consent involves informed and voluntary agreement.","answer":true},"scenario":"Participants are given a clear explanation and asked to sign voluntarily. What ethical standard is this?","scenario_strength":null,"scenario_weakness":null},{"id":54,"concept":"Working with vulnerable individuals (including children)","definition":"Children under the age of 16, those lacking in mental capacity, people in care, people in custody (prison) or on probation, and people engaged in illegal activities, such as drug use, would be categorised in this way.","tag":"Ethics","mc":{"question":"Who counts as vulnerable in research?","options":["Teenagers over 18","Prisoners, children, and mentally impaired people","Everyone in experiments","Teachers and doctors"],"correct":1},"tf":{"statement":"Children and those with reduced capacity are vulnerable participants.","answer":true},"scenario":"A researcher studies teenagers in care. What ethical category applies?","scenario_strength":null,"scenario_weakness":null},{"id":55,"concept":"Working with animals","definition":"Research with non-human species is strictly controlled. Restrictions on type of animal, care, number of animals required etc. are all controlled by ethical guidelines and laws such as the Animals Act (1986).","tag":"Ethics","mc":{"question":"What regulates research with animals?","options":["Institutional policies","Verbal consent","National guidelines and law","Internal review only"],"correct":2},"tf":{"statement":"Research with animals is controlled by law and ethical codes.","answer":true},"scenario":"A psychologist uses rats for a maze test and follows strict housing rules. What ethical area is this?","scenario_strength":null,"scenario_weakness":null},{"id":56,"concept":"Ethics committees","definition":"The board that is in place to ensure that proposed research meets the standards of the current ethical codes of conduct and guidelines.","tag":"Ethics","mc":{"question":"What is the role of an ethics committee?","options":["Recruit participants","Approve research plans for ethical safety","Manage funding","Train psychologists"],"correct":1},"tf":{"statement":"Ethics committees review and approve proposed research.","answer":true},"scenario":"A university team checks whether a study on anxiety meets ethical standards. What body is this?","scenario_strength":null,"scenario_weakness":null},{"id":57,"concept":"Ethical guidelines","definition":"Provide a set of moral principles that guide research from its inception through to completion and publication of results.","tag":"Ethics","mc":{"question":"Why do psychologists follow ethical guidelines?","options":["For easier publishing","To avoid data loss","To protect participants","To speed up research"],"correct":2},"tf":{"statement":"Ethical guidelines are to ensure protection and fairness in research.","answer":true},"scenario":"A study follows procedures to avoid harm, deception, and protect privacy. What are they following?","scenario_strength":null,"scenario_weakness":null},{"id":58,"concept":"Inter-rater reliability","definition":"Where two or more psychologists produce consistent results by using a standardised procedure, agreed coding system, or correlation of their data.","tag":"Reliability","mc":{"question":"What is inter-rater reliability?","options":["Same test over time","Consistency between observers","Reliability of the DV","Participant matching"],"correct":1},"tf":{"statement":"Inter-rater reliability checks agreement between observers.","answer":true},"scenario":"Two observers watch the same behaviour and their ratings match closely. What is this an example of?","scenario_strength":null,"scenario_weakness":null},{"id":59,"concept":"Test-retest reliability","definition":"Involves testing and retesting the same participants over time, with the same test, and comparing their scores. If the scores are the same the test has external reliability.","tag":"Reliability","mc":{"question":"What does test-retest reliability involve?","options":["Testing different people twice","Testing once","Testing the same people at two times","Only testing controls"],"correct":2},"tf":{"statement":"Test-retest involves repeating the same test with the same people.","answer":true},"scenario":"A researcher gives a questionnaire on Monday and again a week later. What type of reliability is being assessed?","scenario_strength":null,"scenario_weakness":null},{"id":60,"concept":"Split-half reliability","definition":"Involves splitting a pp\u2019s test answers in half and seeing whether s/he got the same or similar scores on the two halves. If so, internal reliability is high; if not, it is low and individual questions would need to be redesigned.","tag":"Reliability","mc":{"question":"How does split-half reliability work?","options":["Giving the test twice","Splitting one test into two halves","Using two observers","Changing the DV"],"correct":1},"tf":{"statement":"Split-half tests consistency within a test by dividing it in two.","answer":true},"scenario":"A psychologist checks if participants score similarly on the first and second halves of a test. What is being tested?","scenario_strength":null,"scenario_weakness":null},{"id":61,"concept":"Ways of dealing with reliability","definition":"A measure which improves consistency and accuracy within the results e.g. the use of a standardised procedure or measures such as counterbalancing.","tag":"Reliability","mc":{"question":"What helps improve reliability?","options":["Ignoring variation","Random sampling","Standardised procedures","Asking for feedback"],"correct":2},"tf":{"statement":"Reliability can be improved by making procedures consistent.","answer":true},"scenario":"A study uses identical scripts and timings for all participants. What issue is being addressed?","scenario_strength":null,"scenario_weakness":null},{"id":62,"concept":"Face validity","definition":"The least sophisticated measure of validity. This validity is simply whether the test appears to measure what it claims to, and hence is subjective. Tests where the purpose is clear, even to na\u00efve respondents, are said to have this validity.","tag":"Validity","mc":{"question":"What does face validity rely on?","options":["Expert statistics","Appearance of relevance","Historical accuracy","Data range"],"correct":1},"tf":{"statement":"Face validity is about whether something appears valid on the surface.","answer":true},"scenario":"Participants say a questionnaire on anxiety looks like it measures anxiety. What type of validity is this?","scenario_strength":null,"scenario_weakness":null},{"id":63,"concept":"Content validity","definition":"This objectively checks the method of measuring behaviour is accurate and decides whether it is a fair test that achieves the aims of the study (internal validity). Ask an expert in that specific area of behaviour to check the test is valid.","tag":"Validity","mc":{"question":"How is content validity checked?","options":["Through participant ratings","By testing the same group twice","By asking an expert to assess the test","Through random sampling"],"correct":2},"tf":{"statement":"Content validity is verified by experts checking test relevance.","answer":true},"scenario":"A psychologist gets an educational expert to review a new reading test. What validity is being assessed?","scenario_strength":null,"scenario_weakness":null},{"id":64,"concept":"Construct validity","definition":"The most sophisticated test of validity as it looks at whether the overall results reflect the phenomena as a whole (external validity). Checking the existing definitions of the behaviour being studied and redesigning the test if it measures a different construct.","tag":"Validity","mc":{"question":"What does construct validity assess?","options":["Whether results reflect the wider concept","Whether all items are easy","Score consistency","Confounding variable presence"],"correct":0},"tf":{"statement":"Construct validity checks whether a test truly reflects the concept it aims to measure.","answer":true},"scenario":"A test for aggression is checked against known definitions of aggression. What validity is this?","scenario_strength":null,"scenario_weakness":null},{"id":65,"concept":"Concurrent validity","definition":"Validating a measurement by comparing it with an established measurement that has known validity. If similar results occur on both tests, then this new test is valid.","tag":"Validity","mc":{"question":"How is concurrent validity tested?","options":["Comparing results to an older, validated test","Comparing to expert opinion","Face-to-face interviews","Using multiple choice"],"correct":0},"tf":{"statement":"Concurrent validity uses comparison with established measures.","answer":true},"scenario":"A psychologist compares a new anxiety scale with an existing validated one. What is being checked?","scenario_strength":null,"scenario_weakness":null},{"id":66,"concept":"Predictive validity","definition":"The degree to which a test accurately forecasts a future outcome on a more broadly related topic.","tag":"Validity","mc":{"question":"What does predictive validity show?","options":["Whether a test is short","Future outcomes can be accurately predicted","Face value","Score frequency"],"correct":1},"tf":{"statement":"Predictive validity tests whether a measure can forecast future performance.","answer":true},"scenario":"A test taken in Year 10 accurately predicts exam results in Year 11. What type of validity is shown?","scenario_strength":null,"scenario_weakness":null},{"id":67,"concept":"Ways of dealing with validity","definition":"Improvements through methods such as double or single blind procedures, or through changing the location/nature of the research tasks to make them more reflective of real life.","tag":"Validity","mc":{"question":"How can researchers improve validity?","options":["Repeat the study with same participants","Blind procedures and realistic tasks","Use only quantitative data","Remove the DV"],"correct":1},"tf":{"statement":"Validity is improved by reducing bias and increasing realism.","answer":true},"scenario":"A researcher uses a double-blind design to reduce experimenter influence. What is being addressed?","scenario_strength":null,"scenario_weakness":null},{"id":68,"concept":"Correlational studies","definition":"A research method which involves comparing two continuous variables (co-variables) to see if there is an association/relationship between them.","tag":"Methodologies","mc":{"question":"What do correlational studies examine?","options":["Causal effects","Relationships between variables","Group averages","Experimental controls"],"correct":1},"tf":{"statement":"Correlational studies look for associations between variables.","answer":true},"scenario":"A study investigates whether sleep hours are related to stress levels. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":69,"concept":"Case studies","definition":"A method which involves an in-depth investigation of a phenomenon, which uses a descriptive analysis of a person, group or event. It is a holistic study through one or more methodologies that is usually longitudinal.","tag":"Methodologies","mc":{"question":"What is a case study?","options":["A brief survey","In-depth study of one subject/event over time","A double-blind trial","Experimental manipulation"],"correct":1},"tf":{"statement":"A case study focuses in detail on a single person, group, or event.","answer":true},"scenario":"A researcher wants to understand a rare condition, he choses one patient adn then conducts multiple studies involving this participant using a verity of methods. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":70,"concept":"Brain scans","definition":"A research method which involves taking images of the living brain to investigate brain function e.g. PET, fMRI and CAT scans.","tag":"Methodologies","mc":{"question":"What do brain scans investigate?","options":["Eye movement","Cognitive interviews","Brain structure/function","Self-esteem"],"correct":2},"tf":{"statement":"Brain scans show activity and structure in the brain.","answer":true},"scenario":"A psychologist uses fMRI to study memory-related brain activity. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":71,"concept":"Longitudinal studies","definition":"A method which involves conducting research over a long period of time in order to observe long-term effects of X on a specific behaviour. It may utilise a range of other methodologies such as case studies, interviews etc.","tag":"Methodologies","mc":{"question":"What is the focus of a longitudinal study?","options":["Immediate reaction","Short surveys","Long-term changes and effects","Random allocation"],"correct":2},"tf":{"statement":"Longitudinal studies track changes over time.","answer":true},"scenario":"A researcher studies development in the same group of children from ages 5 to 15. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":72,"concept":"Cross-sectional studies","definition":"A method which involves comparing one group of participants, representing a cross-section of society, against another at the same point in time.","tag":"Methodologies","mc":{"question":"What does a cross-sectional study do?","options":["Follows a group over time","Compares different groups at one time point","Uses repeated measures","Measures brain activity"],"correct":1},"tf":{"statement":"Cross-sectional studies compare groups simultaneously.","answer":true},"scenario":"A researcher compares stress levels of teens, adults, and elderly people on one day. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":73,"concept":"Self-reports","definition":"A method which involves a participant reporting on their own thoughts and feelings through methods such as interviews or questionnaires.","tag":"Methodologies","mc":{"question":"What are self-reports?","options":["Observational ratings","Participant\u2019s own account of thoughts and feelings","Lab results","Peer reviews"],"correct":1},"tf":{"statement":"Self-reports include data from participants\u2019 own descriptions.","answer":true},"scenario":"A person completes a mood diary for 7 days. What kind of method is this?","scenario_strength":null,"scenario_weakness":null},{"id":74,"concept":"Questionnaires","definition":"A research method that includes a list of written questions, which generate closed and/or open answers. These can be used in person, online or through other methods e.g. postal.","tag":"Methodologies","mc":{"question":"What are questionnaires used for?","options":["Unstructured interviews","Collecting standardised answers from many people","Matching controls","Observational coding"],"correct":1},"tf":{"statement":"Questionnaires collect written responses from participants.","answer":true},"scenario":"A psychologist emails a set of 10 questions about anxiety. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":75,"concept":"Structured interviews","definition":"A research method that includes standardised questions (like in a questionnaire), which are known as an interview schedule, and are usually asked face to face.","tag":"Methodologies","mc":{"question":"What defines a structured interview?","options":["Open discussion","Observation notes","Pre-set standardised questions","Follow-up only"],"correct":2},"tf":{"statement":"Structured interviews use identical questions for all participants.","answer":true},"scenario":"A researcher reads the same list of questions to every volunteer. What method is this?","scenario_strength":null,"scenario_weakness":null},{"id":76,"concept":"Semi-structured interviews","definition":"A research method which involves asking participants questions, usually face to face. These can be in the form of an interview schedule but could also include follow up questions to expand on answers of the questions asked.","tag":"Methodologies","mc":{"question":"What is unique about semi-structured interviews?","options":["No structure","Only closed questions","Mix of standard and follow-up questions","Online only"],"correct":2},"tf":{"statement":"Semi-structured interviews mix set questions with flexible follow-ups.","answer":true},"scenario":"A researcher starts with fixed questions but probes deeper based on answers. What type of interview is this?","scenario_strength":null,"scenario_weakness":null},{"id":77,"concept":"Pilot studies","definition":"A small-scale trial run of the study used to test any aspects of the design, with the aim of making improvements.","tag":"Methodologies","mc":{"question":"What is a pilot study?","options":["A final draft","Small-scale version of full study to test procedures","An interview","First participant"],"correct":1},"tf":{"statement":"Pilot studies are trial runs to refine methods.","answer":true},"scenario":"A researcher runs a test with 5 people to check instructions are clear. What is this called?","scenario_strength":null,"scenario_weakness":null},{"id":78,"concept":"Peer review","definition":"When other experts in the field review your research (before publication) to check for bias, ethical issues or poor methodology.","tag":"Ethics","mc":{"question":"Why is peer review important?","options":["To simplify research","For ethical approval","To ensure research quality before publication","To control data"],"correct":2},"tf":{"statement":"Peer review ensures standards and accuracy in scientific work.","answer":true},"scenario":"A journal sends a submitted article to experts for evaluation. What process is this?","scenario_strength":null,"scenario_weakness":null},{"id":79,"concept":"Primary data","definition":"Information that is collected first-hand by the psychologist.","tag":"Data types","mc":{"question":"What is primary data?","options":["Data taken from previous studies","Data from textbooks","First-hand data collected by the researcher","Peer-reviewed summaries"],"correct":2},"tf":{"statement":"Primary data is collected directly by the researcher.","answer":true},"scenario":"A psychologist designs a survey and gathers new responses. What kind of data is this?","scenario_strength":null,"scenario_weakness":null},{"id":80,"concept":"Secondary data","definition":"Information that has been collected previously, not directly by the psychologist conducting the study.","tag":"Data types","mc":{"question":"What is secondary data?","options":["New survey data","Historical and previously published data","Observations in real time","Results of pilot studies"],"correct":1},"tf":{"statement":"Secondary data comes from previous sources.","answer":true},"scenario":"A psychologist reuses NHS mental health statistics. What kind of data is this?","scenario_strength":null,"scenario_weakness":null},{"id":81,"concept":"Self-report (Evaluation)","definition":"+(Allows access to subjective thoughts and emotions directly from the participant)+(Can be conducted quickly and efficiently with large samples)-(May suffer from demand characteristics and social desirability bias)-(Limited by participants\u2019 self-awareness or willingness to disclose)","tag":"Methodologies","mc":{"question":"Which is a strength of self-reports?","options":["They avoid bias","They gather deep personal insight","They always give reliable data","They require no consent"],"correct":1},"tf":{"statement":"Self-reports allow insight into participant thoughts and feelings.","answer":true},"scenario":null,"scenario_strength":"A researcher collects emotional responses through a questionnaire. Give ONE strength or advantage of this method.","scenario_weakness":"A researcher collects emotional responses through a questionnaire. Give ONE weakness or limitation of this method."},{"id":82,"concept":"Observations (Evaluation)","definition":"+(High ecological validity if done in a natural setting)+(Can gather real-time, spontaneous behaviour)-(Observer bias or poor inter-rater reliability may reduce objectivity)-(Lack of control over extraneous variables in naturalistic observations)","tag":"Methodologies","mc":{"question":"What is a weakness of observational methods?","options":["They always show cause","They lack ecological validity","Observer bias may occur","They're always structured"],"correct":2},"tf":{"statement":"Naturalistic observation may lead to lack of control over variables.","answer":true},"scenario":null,"scenario_strength":"A psychologist watches playground behaviour. Give ONE strength or advantage of this method.","scenario_weakness":"A psychologist watches playground behaviour. Give ONE weakness or limitation of this method."},{"id":83,"concept":"Experiments (Evaluation)","definition":"+(Lab experiments have high control and replicability)+(Clear causal relationships can be identified)-(Artificial settings can reduce ecological validity)-(Demand characteristics may affect internal validity)","tag":"Methodologies","mc":{"question":"Which is an advantage of lab experiments?","options":["Natural setting","High realism","Causal relationships can be tested","They require no variables"],"correct":2},"tf":{"statement":"Experiments allow cause-effect conclusions due to controlled variables.","answer":true},"scenario":null,"scenario_strength":"A study tests memory in a lab. Give ONE strength or advantage of this method.","scenario_weakness":"A study tests memory in a lab. Give ONE weakness or limitation of this method."},{"id":84,"concept":"Correlational research (Evaluation)","definition":"+(Useful for identifying relationships for further study)+(Can use secondary data and large datasets)-(Cannot establish cause and effect)-(Relationships may be due to extraneous variables)","tag":"Methodologies","mc":{"question":"Which is a disadvantage of co ,"options":["High control","Natural behaviour","Remote access","Low reliability"],"correct":0},"tf":null,"scenario":"A psychologist tests memory using a word list in a quiet university room with strict time controls. What type of experiment is this, and what is one advantage of this setting?","scenario_strength":null,"scenario_weakness":null},{"id":101,"concept":"Field experiment","definition":"A type of research conducted in a real-world setting where the researcher still manipulates the IV but has less control over extraneous variables. More natural behaviour but lower internal control.","tag":"Location","mc":{"question":"Which of the following is an advantage of field experiments?","options":["Full control over all variables  B. High ecological validity","Unobtrusive recording","No ethical considerations"],"correct":0},"tf":null,"scenario":"You study helping behaviour by dropping pens in a busy shopping street and recording responses. What type of experiment is this, and what is one limitation?","scenario_strength":null,"scenario_weakness":null},{"id":102,"concept":"Online experiment","definition":"A type of study conducted over the internet, often using software or platforms that allow participants to complete tasks remotely. Offers wide reach and convenience but can reduce control.","tag":"Location","mc":{"question":"Which is a potential disadvantage of online experiments?","options":["Time efficiency","Wider access to participants  C. Less control over conditions","Cost-effectiveness"],"correct":1},"tf":null,"scenario":"Participants complete a reaction time test via a web link sent by a researcher. What are two strengths and one weakness of this research location?","scenario_strength":null,"scenario_weakness":null},{"id":103,"concept":"Laboratory experiment (Evaluation)","definition":"+Allows precise control over extraneous variables, increasing internal validity +Standardised procedures improve reliability -Artificial setting may reduce ecological validity -P r advantage of this method.","scenario_weakness":"A cognitive task is emailed to participants across different time zones. Give ONE weakness or limitation of this method."},{"id":106,"concept":"Time sampling","definition":"A behavioural observation technique where observations are made at fixed intervals (e.g., every 30 seconds), regardless of what the participant is doing. Used to reduce data volume and increase structure.","tag":"Methodologies","mc":{"question":"What best describes time sampling? [CORRECT]","options":["Observing at fixed time intervals","Noting every single behaviour","Watching full interactions","Randomised interviews"],"correct":0},"tf":null,"scenario":"A psychologist observes students every 15 seconds during a lesson and records on-task behaviour. What is this method called and what is one advantage?","scenario_strength":null,"scenario_weakness":null},{"id":107,"concept":"Event sampling","definition":"A behavioural observation technique where every instance of a specific behaviour is recorded during a set period. Useful for studying infrequent or clearly defined behaviours.","tag":"Methodologies","mc":{"question":"Which behaviour would be best studied using event sampling?","options":["Chatting in a queue  B. Hitting during playtime","General movement in corridors","Group discussion flow"],"correct":0},"tf":null,"scenario":"A researcher observes a playground and records every instance of aggressive behaviour. What is the method and what kind of behaviour suits this approach?","scenario_strength":null,"scenario_weakness":null},{"id":108,"concept":"Behavioural category","definition":"A clearly defined set of observable behaviours used in an observation. Researchers break down general behaviours into specific, countable actions to improve reliability.","tag":"Methodologies","mc":{"question":"Why are behavioural categories used in observation?","options":["To make participants behave better  B. To improve reliability and clarity","To reduce behaviour","To test hypotheses statistically"],"correct":0},"tf":null,"scenario":"A researcher studying aggression lists \u201cpushing\u201d, \u201chitting\u201d, and \u201cshouting\u201d before the observation begins. What technique is being used and why?","scenario_strength":null,"scenario_weakness":null},{"id":109,"concept":"Internal reliability","definition":"The consistency of a measure within itself, such as whether different items on a questionnaire or test produce similar results. Often tested using the split-half method.","tag":"Reliability","mc":{"question":"Which technique is used to assess internal reliability?","options":["Test-retest","Inter-rater reliability  C. Split-half method","Ecological validity"],"correct":1},"tf":null,"scenario":"A psychologist develops a new stress questionnaire. They divide the items in half and find both halves produce similar results. What are they testing for?","scenario_strength":null,"scenario_weakness":null},{"id":110,"concept":"External reliability","definition":"The extent to which a measure or study produces consistent results when repeated over time or with different researchers. Often tested using test-retest or inter-rater reliability.","tag":"Reliability","mc":{"question":"Which method is used to assess external reliability?","options":["Content analysis  B. Test-retest","Random sampling","Split-half"],"correct":0},"tf":null,"scenario":"A group of researchers repeat an experiment with a new sample and obtain similar results. What type of reliability does this demonstrate?","scenario_strength":null,"scenario_weakness":null},{"id":111,"concept":"Structured observation","definition":"A type of observation that uses a predefined checklist or coding system to record behaviours in a consistent and systematic way. Often used to improve reliability.","tag":"Methodologies","mc":{"question":"Which best describes structured observation?","options":["Casual note-taking of events","Asking participants questions  C. Using a fixed behavioural checklist","Drawing conclusions from interviews"],"correct":1},"tf":null,"scenario":"A researcher observes playground aggression using a grid to tally every incident of \u201cpushing\u201d or \u201chitting.\u201d What observation type is this?","scenario_strength":null,"scenario_weakness":null},{"id":112,"concept":"Unstructured observation","definition":"An observational technique where the researcher records all relevant behaviours without a pre-established system. Allows for flexibility but may reduce reliability.","tag":"Methodologies","mc":{"question":"Which is a likely drawback of unstructured observation?","options":["Too much control","Misses unusual behaviours  C. Lower reliability","Ignores ethics"],"correct":1},"tf":null,"scenario":"A psychologist watches group discussion without a checklist and writes open notes on all behaviours. What is the method and one risk?","scenario_strength":null,"scenario_weakness":null},{"id":113,"concept":"Naturalistic observation","definition":"Observation carried out in the participants' usual environment without interference or manipulation. It aims to study behaviour in a real-life context.","tag":"Methodologies","mc":{"question":"Which is a key strength of naturalistic observation?","options":["High internal validity","Use of deception  C. High ecological validity","Structured checklist use"],"correct":1},"tf":null,"scenario":"A study records children\u2019s interactions during free play in a nursery, with no researcher interference. What is the method and one strength?","scenario_strength":null,"scenario_weakness":null},{"id":114,"concept":"Controlled observation","definition":"An observation conducted in a structured or artificial setting where variables may be controlled, such as a lab. Balances control and observation.","tag":"Methodologies","mc":{"question":"Which setting is most likely to be used in controlled observation?","options":["A participant\u2019s home  B. A lab or simulated room","A shopping centre","A forest trail"],"correct":0},"tf":null,"scenario":"A researcher asks two children to play with toys in a room while being recorded under observation. What is the method and one limitation?","scenario_strength":null,"scenario_weakness":null},{"id":115,"concept":"Operationalisation","definition":"The process of defining variables in a way that makes them measurable and testable, such as converting \u201cstress\u201d into a score on a questionnaire.","tag":"Variables","mc":{"question":"Why is operationalisation important in research?","options":["It helps gather qualitative data","It allows for theoretical discussion  C. It enables accurate measurement of variables","It creates ethical protection"],"correct":1},"tf":null,"scenario":"A researcher wants to measure anxiety and chooses to use heart rate as a variable. What process is this an example of?","scenario_strength":null,"scenario_weakness":null},{"id":116,"concept":"Covert observation","definition":"A type of observation where participants are unaware they are being observed, which helps avoid demand characteristics but may raise ethical concerns. +Reduces demand characteristics by avoiding reactivity +Allows observation of natural behaviour -Raises ethical issues around informed consent -Participants may feel deceived if they discover the observation later","tag":"Methodologies","mc":{"question":"What is an ethical drawback of covert observation?","options":["It increases bias  B. It may lack informed consent","It requires too much equipment","It is too structured"],"correct":0},"tf":null,"scenario":"A researcher observes behaviour on a train platform without informing the public. What method is this and what ethical issue does it raise?","scenario_strength":null,"scenario_weakness":null},{"id":117,"concept":"Overt observation","definition":"A type of observation where participants know they are being observed. More ethical but may lead to altered behaviour. +Ethically transparent due to informed consent +P // CLOUD — ALL via Vercel proxy, no keys in browser
// ═══════════════════════════════════════════════════════════════════════════
let cloudOk = false;

function proxyAvailable(){return PROXY_URL && PROXY_URL.trim()!==''}

async function cloudGet(){
  if(!proxyAvailable())return null;
  try{
    const r=await fetch(PROXY_URL+'?method=GET');
    if(!r.ok)return null;
    return await r.json();
  }catch{return null}
}

async function cloudPut(record){
  if(!proxyAvailable())return false;
  try{
    const r=await fetch(PROXY_URL+'?method=PUT',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(record)
    });
    return r.ok;
  }catch{return false}
}

async function cloudReadAll(){
  const rec=await cloudGet();
  if(rec!==null)cloudOk=true;
  return rec;
}

async function cloudWriteStudent(studentData){
  if(!proxyAvailable())return;
  try{
    const rec=await cloudGet()||{};
    rec.students=rec.students||{};
    rec.students[studentData.name]=studentData;
    const ok=await cloudPut(rec);
    if(ok)cloudOk=true;
  }catch{}
}

async function cloudWriteAll(rec){
  return await cloudPut(rec);
}

// Teacher auth — PIN checked server-side
async function verifyTeacherPin(pin){
  if(!proxyAvailable()){
    // Fallback: if no proxy, warn but allow with local placeholder
    return {ok:false,error:'No proxy configured — set PROXY_URL in index.html'};
  }
  try{
    const r = await fetch(PROXY_URL+'?method=AUTH',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({pin})
    });
    return await r.json();
  }catch{return{ok:false,error:'Could not reach server'}}
}

// Debounced sync
let syncTimer=null;
function scheduleSync(data){
  clearTimeout(syncTimer);
  syncTimer=setTimeout(()=>cloudWriteStudent(data),3000);
}

// Pull approved answers from cloud on startup
async function syncApprovedAnswers(){
  const rec=await cloudReadAll();
  if(rec&&rec.approvedAnswers)saveApprovedAnswers(rec.approvedAnswers);
  // Also merge cloud students locally
  if(rec&&rec.students){
    const local=getStudents();
    const merged={...rec.students,...local}; // local takes precedence
    saveStudents(merged);
  }
}

// RAG
// ═══════════════════════════════════════════════════════════════════════════
function getRAG(correct,answered){if(answered===0)return'unset';const p=correct/answered;if(p>=0.75)return'green';if(p>=0.5)return'amber';return'red'}
function getRAGColor(rag){return{green:'#22c55e',amber:'#f59e0b',red:'#ef4444',unset:'#6b6b85'}[rag]||'#6b6b85'}

// ═══════════════════════════════════════════════════════════════════════════
// WEIGHTED SELECTION
// ═══════════════════════════════════════════════════════════════════════════
function selectQuestion(userData,category,usedIds){
  let pool=QUESTIONS.filter(q=>q.definition&&q.mc);
  if(category&&category!=='all')pool=pool.filter(q=>q.tag===category);
  pool=pool.filter(q=>!usedIds.has(q.id));
  if(!pool.length)return null;
  const weights=pool.map(q=>{
    const st=userData.termStats[q.concept];
    if(!st||st.answered===0)return 4;
    const p=st.correct/st.answered;
    if(p>=0.75)return 1;if(p>=0.5)return 3;return 5;
  });
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){r-=weights[i];if(r<=0)return pool[i]}
  return pool[pool.length-1];
}

function selectQuestionType(q,userData){
  const st=userData.termStats[q.concept];
  const answered=st?st.answered:0;
  const rag=answered>0?getRAG(st.correct,st.answered):'unset';
  if(q.concept&&q.concept.includes('Evaluation')&&(q.scenario_strength||q.scenario_weakness))
    return Math.random()<0.5?'eval_strength':'eval_weakness';
  if(answered===0)return Math.random()<0.4?'definition':'mc';
  let types=['mc','mc','reverse'];
  if(q.tf)types.push('tf');
  if(q.scenario&&!q.scenario_strength)types.push('scenario');
  if(rag==='red'||rag==='amber'){
    if(q.scenario&&!q.scenario_strength)types.push('scenario','scenario');
    types.push('definition','definition');
  }
  return types[Math.floor(Math.random()*types.length)];
}

function startSmartReview(){
  const data=getUserData(currentUser.name);
  const tags=[...new Set(QUESTIONS.map(q=>q.tag))];
  let worst=null,worstPct=1;
  for(const tag of tags){
    const qs=QUESTIONS.filter(q=>q.tag===tag);
    const ts=qs.map(q=>data.termStats[q.concept]||{answered:0,correct:0});
    const answered=ts.reduce((a,b)=>a+b.answered,0),correct=ts.reduce((a,b)=>a+b.correct,0);
    if(answered>0){const p=correct/answered;if(p<worstPct){worstPct=p;worst=tag}}
  }
  startQuiz(worst||'all',10);
}
