<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
    <title>PsychCat Component 2</title>

    <!-- 1. LINK TO EXTERNAL CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- 2. LINK TO MODULAR SCRIPTS -->
    <script src="/js/api-client.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/quiz-engine.js"></script>
    <script src="/js/checker.js"></script>
    <script src="/js/ui-manager.js"></script>
</head>
<body>
    <div id="splash">...</div> <!-- Existing Splash -->
    
    <div class="screen active" id="loginScreen">...</div> <!-- Login screens -->
    <div class="screen" id="homeScreen">...</div> <!-- Dashboard screen -->
    <div class="screen" id="quizScreen">...</div> <!-- Quiz screen -->
    <div class="screen" id="rankScreen">...</div> <!-- Rank screen -->

    <script>
    // GLOBAL STATE
    window.S = null; window.QUESTIONS = []; window.QZ = null; window.APPROVED = {};

    window.addEventListener('load', async () => {
        const d = await ApiClient.call('GET_QUESTIONS');
        window.QUESTIONS = d.questions || [];
        window.APPROVED = d.approvedAnswers || {};
        document.getElementById('splash').style.display = 'none';
    });

    async function handleLookup() {
        const name = document.getElementById('iName').value.trim();
        const res = await Auth.lookup(name);
        document.getElementById('loginStep1').style.display = 'none';
        if (res.exists) {
            document.getElementById('loginPin').style.display = 'block';
            document.getElementById('pinMsg').textContent = `Hi, ${res.nickname}! Enter PIN:`;
        } else {
            document.getElementById('loginNew').style.display = 'block';
        }
    }

    async function verifyPin() {
        if (window.S.pin === document.getElementById('iPin').value) showHome();
        else alert("Wrong PIN");
    }

    async function createAccount() {
        await Auth.signup({
            name: document.getElementById('iName').value.trim(),
            pin: document.getElementById('nPin').value,
            year: document.getElementById('sYear').value,
            group: document.getElementById('sGroup').value,
            teacher: document.getElementById('sTeacher').value
        });
        showHome();
    }

    function showHome() { 
        UIManager.showScreen('homeScreen'); 
        UIManager.renderDashboard(); 
    }

    function startQuiz(mode, tag = null) {
        QuizEngine.init(mode, tag);
        UIManager.showScreen('quizScreen');
        UIManager.renderQuestion();
    }

    async function handleCheck() {
        const ans = document.getElementById('qAns').value;
        const btn = document.getElementById('btnCheck');
        btn.innerHTML = '<span class="spinner"></span>';
        
        const res = await Checker.verify(window.QZ.activeTask, ans);
        
        const fb = document.getElementById('qFeedback');
        fb.style.display = "block";
        fb.className = `fb-box ${res.ok ? 'ok' : 'ng'}`;
        fb.innerHTML = `<b>${res.ok ? 'Correct!' : 'Incorrect'}</b><br>${window.QZ.activeTask.q.concept}`;
        
        if (res.ok) window.QZ.score++;
        window.QZ.results.push({ concept: window.QZ.activeTask.q.concept, ok: res.ok });
        
        btn.style.display = "none";
        document.getElementById('btnSkip').style.display = "none";
        document.getElementById('btnNext').style.display = "flex";
    }

    function handleNext() {
        if (QuizEngine.next()) {
            UIManager.renderQuestion();
            document.getElementById('btnCheck').style.display = "flex";
            document.getElementById('btnSkip').style.display = "flex";
            document.getElementById('btnNext').style.display = "none";
        } else {
            finishQuiz();
        }
    }

    async function finishQuiz() {
        // Update window.S with QZ.results
        window.QZ.results.forEach(r => {
            window.S.totalAnswered++;
            if (r.ok) window.S.totalCorrect++;
            const st = window.S.termStats[r.concept] || {answered:0, correct:0, skipped:0};
            st.answered++;
            if (r.ok) st.correct++;
            window.S.termStats[r.concept] = st;
        });
        await ApiClient.call('PUT_STUDENT', { student: window.S });
        showHome();
    }
    </script>
</body>
</html>
