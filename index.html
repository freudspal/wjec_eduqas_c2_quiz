// QUIZ ENGINE
// ═══════════════════════════════════════════════════════════════════════════
function startQuiz(category,size){
  const data=getUserData(currentUser.name);
  quizState={category,sessionSize:size,questions:[],currentIdx:0,correct:0,usedIds:new Set(),results:[]};
  for(let i=0;i<size;i++){
    const q=selectQuestion(data,category,quizState.usedIds);
    if(!q)break;
    quizState.usedIds.add(q.id);
    quizState.questions.push({q,type:selectQuestionType(q,data)});
  }
  if(!quizState.questions.length){alert('No questions available!');return}
  showScreen('quizScreen');renderQuestion();
}

function renderQuestion(){
  const {questions,currentIdx}=quizState;
  if(currentIdx>=questions.length){showResult();return}
  const {q,type}=questions[currentIdx];
  document.getElementById('quizProgressFill').style.width=((currentIdx/questions.length)*100)+'%';
  document.getElementById('quizCounter').textContent=(currentIdx+1)+'/'+questions.length;
  document.getElementById('quizTagBadge').textContent=q.tag;
  const renders={mc:renderMC,tf:renderTF,definition:renderDefinition,scenario:renderScenario,reverse:renderReverse,eval_strength:q=>renderEvalScenario(q,'strength'),eval_weakness:q=>renderEvalScenario(q,'weakness')};
  document.getElementById('quizContent').innerHTML=(renders[type]||renderMC)(q);
  document.getElementById('quizContent').scrollTop=0;
}

function renderMC(q){
  const L=['A','B','C','D'];
  return`<div class="q-type-badge badge-mc">Multiple Choice</div>
    <div class="q-concept">${q.concept}</div>
    <div class="q-instruction">Choose the best answer:</div>
    <div class="q-text" style="font-style:italic;color:var(--muted)">${q.mc.question}</div>
    <div class="mc-options">${q.mc.options.map((o,i)=>`<div class="mc-option" onclick="submitMC(${i},${q.mc.correct},${q.id})" id="opt${i}"><div class="option-letter">${L[i]}</div><div>${o}</div></div>`).join('')}</div>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question &#8594;</button>`;
}

function renderReverse(q){
  const pool=QUESTIONS.filter(x=>x.tag===q.tag&&x.concept!==q.concept&&x.mc);
  const dist=pool.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.concept);
  while(dist.length<3)dist.push('None of the above');
  const opts=[q.concept,...dist].sort(()=>Math.random()-.5);
  const ci=opts.indexOf(q.concept);
  const L=['A','B','C','D'];
  return`<div class="q-type-badge badge-reverse">Identify the Term</div>
    <div style="color:var(--muted);font-size:.9rem;margin-bottom:12px">Which term matches this definition?</div>
    <div class="q-text" style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;font-style:italic">"${q.definition}"</div>
    <div class="mc-options">${opts.map((o,i)=>`<div class="mc-option" onclick="submitMCReverse(${i},${ci},${q.id})" id="opt${i}"><div class="option-letter">${L[i]}</div><div>${o}</div></div>`).join('')}</div>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question &#8594;</button>`;
}

function renderTF(q){
  return`<div class="q-type-badge badge-tf">True or False?</div>
    <div class="q-concept">${q.concept}</div>
    <div class="q-instruction">Is this statement true or false?</div>
    <div class="q-text">"${q.tf.statement}"</div>
    <div class="tf-buttons">
      <button class="tf-btn true-btn" onclick="submitTF(true,${q.tf.answer},${q.id})" id="tfTrue">&#10003; True</button>
      <button class="tf-btn false-btn" onclick="submitTF(false,${q.tf.answer},${q.id})" id="tfFalse">&#10007; False</button>
    </div>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question &#8594;</button>`;
}

function renderDefinition(q){
  return`<div class="q-type-badge badge-def">Define the Term</div>
    <div class="q-concept">${q.concept}</div>
    <div class="q-instruction">Type the definition in your own words:</div>
    <textarea class="text-entry-area" id="defAnswer" placeholder="Write the definition here..."></textarea>
    <button class="check-btn" onclick="checkDefinition(${q.id})">Check Answer &#10003;</button>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question &#8594;</button>`;
}

function renderScenario(q){
  return`<div class="q-type-badge badge-scenario">Scenario</div>
    <div class="q-concept">${q.concept}</div>
    <div class="q-instruction">Apply your knowledge:</div>
    <div class="q-text">${q.scenario}</div>
    <textarea class="text-entry-area" id="scenAnswer" placeholder="Write your answer here..."></textarea>
    <button class="check-btn" onclick="checkScenario(${q.id})">Check Answer &#10003;</button>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question &#8594;</button>`;
}

function renderEvalScenario(q,variant){
  const txt=variant==='strength'?q.scenario_strength:q.scenario_weakness;
  const hint=variant==='strength'?'What does this method do WELL? (e.g. validity, reliability, ethics)':'What is a PROBLEM with this method? (e.g. low validity, demand characteristics)';
  return`<div class="q-type-badge badge-scenario">Evaluation: ${variant==='strength'?'Strength':'Weakness'}</div>
    <div class="q-concept">${q.concept.replace(' (Evaluation)','')}</div>
    <div class="q-instruction">${hint}</div>
    <div class="q-text">${txt||q.scenario}</div>
    <textarea class="text-entry-area" id="scenAnswer" placeholder="Write one ${variant} here..."></textarea>
    <button class="check-btn" onclick="checkEvalScenario(${q.id},'${variant}')">Check Answer &#10003;</button>
    <div class="feedback-box" id="feedbackBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question &#8594;</button>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// ANSWER HANDLERS
// ═══════════════════════════════════════════════════════════════════════════
function lockMC(chosen,correct){
  document.querySelectorAll('.mc-option').forEach((el,i)=>{
    el.classList.add('disabled');
    if(i===correct)el.classList.add('correct');
    if(i===chosen&&chosen!==correct)el.classList.add('wrong');
  });
  document.getElementById('nextBtn').style.display='block';
}

function submitMC(chosen,correct,qId){
  const q=QUESTIONS.find(q=>q.id===qId);
  lockMC(chosen,correct);
  showFeedback(chosen===correct,q.definition);
  recordAnswer(q,chosen===correct);
}
function submitMCReverse(chosen,correct,qId){
  const q=QUESTIONS.find(q=>q.id===qId);
  lockMC(chosen,correct);
  showFeedback(chosen===correct,q.definition);
  recordAnswer(q,chosen===correct);
}
function submitTF(chosen,correct,qId){
  const q=QUESTIONS.find(q=>q.id===qId);
  ['tfTrue','tfFalse'].forEach(id=>document.getElementById(id).classList.add('disabled'));
  if(correct===true)document.getElementById('tfTrue').classList.add('correct');
  else document.getElementById('tfFalse').classList.add('correct');
  if(chosen!==correct)(chosen?document.getElementById('tfTrue'):document.getElementById('tfFalse')).classList.add('wrong');
  showFeedback(chosen===correct,q.definition);
  recordAnswer(q,chosen===correct);
  document.getElementById('nextBtn').style.display='block';
}

async function checkDefinition(qId){
  const q=QUESTIONS.find(q=>q.id===qId);
  const ans=document.getElementById('defAnswer').value.trim();
  if(!ans){alert('Please write something first!');return}
  document.querySelector('.check-btn').disabled=true;
  showChecking();
  try{
    const result=await checkWithAI(ans,q.definition,q.concept);
    showFeedback(result.correct,q.definition,result.feedback);
    recordAnswer(q,result.correct);
  }catch{
    const kws=q.definition.toLowerCase().split(/\s+/).filter(w=>w.length>4);
    const ok=kws.filter(k=>ans.toLowerCase().includes(k)).length>=Math.ceil(kws.length*.3);
    showFeedback(ok,q.definition,ok?'Good effort!':'Check the definition below.');
    recordAnswer(q,ok);
  }
  document.getElementById('nextBtn').style.display='block';
}

async function checkScenario(qId){
  const q=QUESTIONS.find(q=>q.id===qId);
  const ans=document.getElementById('scenAnswer').value.trim();
  if(!ans){alert('Please write something first!');return}
  document.querySelector('.check-btn').disabled=true;
  showChecking();
  try{
    const result=await checkScenarioWithAI(ans,q.scenario,q.concept,q.definition);
    showFeedback(result.correct,`${q.concept}: ${q.definition}`,result.feedback);
    recordAnswer(q,result.correct);
  }catch{
    const ok=ans.toLowerCase().includes(q.concept.toLowerCase().split(' ')[0]);
    showFeedback(ok,`${q.concept}: ${q.definition}`,ok?'Key concept identified!':'Check the definition below.');
    recordAnswer(q,ok);
  }
  document.getElementById('nextBtn').style.display='block';
}

async function checkEvalScenario(qId,variant){
  const q=QUESTIONS.find(q=>q.id===qId);
  const ans=document.getElementById('scenAnswer').value.trim();
  if(!ans){alert('Please write something first!');return}
  document.querySelector('.check-btn').disabled=true;
  showChecking();
  const defn=q.definition||'';
  const strengths=(defn.match(/\+([^+\-\n]+)/g)||[]).map(s=>s.slice(1).trim()).join('; ');
  const weaknesses=(defn.match(/\-([^+\-\n]+)/g)||[]).map(s=>s.slice(1).trim()).join('; ');
  const expected=variant==='strength'?strengths:weaknesses;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,
        messages:[{role:'user',content:'A-level psychology marking. Student asked for ONE '+variant+' of "'+q.concept.replace(' (Evaluation)','')+'".\nExpected: "'+expected+'"\nStudent: "'+ans+'"\nBe generous. JSON only: {"correct":true/false,"feedback":"1 sentence"}'}]})
    });
    const d=await r.json();
    const result=JSON.parse(d.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim());
    showFeedback(result.correct,(variant==='strength'?'Strengths: ':'Weaknesses: ')+expected,result.feedback);
    recordAnswer(q,result.correct);
  }catch{
    const kws=expected.toLowerCase().split(/\s+/).filter(w=>w.length>4);
    const ok=kws.some(k=>ans.toLowerCase().includes(k));
    showFeedback(ok,(variant==='strength'?'Strengths: ':'Weaknesses: ')+expected);
    recordAnswer(q,ok);
  }
  document.getElementById('nextBtn').style.display='block';
}

function showChecking(){
  const fb=document.getElementById('feedbackBox');
  fb.style.display='block';fb.className='feedback-box checking';
  fb.innerHTML='<span class="checking-spinner"></span> Checking with AI...';
}

function showFeedback(isCorrect,definition,extraFeedback){
  const fb=document.getElementById('feedbackBox');
  fb.style.display='block';fb.className='feedback-box '+(isCorrect?'correct':'wrong');
  const qObj=quizState.questions[quizState.currentIdx];
  const concept=qObj?qObj.q.concept:'';
  fb.innerHTML=`<div class="${isCorrect?'feedback-correct':'feedback-wrong'}">
    <div class="feedback-title">${isCorrect?'✓ Correct!':'✗ Not quite!'}${extraFeedback?' — '+extraFeedback:''}</div>
    <div class="feedback-def"><strong>Definition:</strong> ${definition}</div>
  </div>
  <button class="flag-btn" onclick="openFlagModal('${concept.replace(/'/g,"\\'")}')">🚩 Report an issue</button>`;
}

async function checkWithAI(ans,def,concept){
  const approved=getApprovedAnswers();
  const extras=approved[concept]?'\nApproved alternatives: '+approved[concept].join(' | '):'';
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,
      messages:[{role:'user',content:'A-level psychology marking.\nConcept: "'+concept+'"\nDefinition: "'+def+'"'+extras+'\nStudent: "'+ans+'"\nBe generous — reward understanding. JSON only: {"correct":true/false,"feedback":"1-2 sentence feedback"}'}]})
  });
  const d=await r.json();
  return JSON.parse(d.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim());
}

async function checkScenarioWithAI(ans,scenario,concept,def){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,
      messages:[{role:'user',content:'A-level psychology scenario marking.\nScenario: "'+scenario+'"\nConcept: "'+concept+'"\nDefinition: "'+def+'"\nStudent: "'+ans+'"\nJSON only: {"correct":true/false,"feedback":"1-2 sentences"}'}]})
  });
  const d=await r.json();
  return JSON.parse(d.content.map(i=>i.text||'').join('').replace(/```json|```/g,'').trim());
}

function recordAnswer(q,isCorrect){
  const data=getUserData(currentUser.name);
  data.totalAnswered=(data.totalAnswered||0)+1;
  if(isCorrect)data.totalCorrect=(data.totalCorrect||0)+1;
  data.streak=isCorrect?(data.streak||0)+1:0;
  data.maxStreak=Math.max(data.maxStreak||0,data.streak);
  if(!data.categoryStats[q.tag])data.categoryStats[q.tag]={answered:0,correct:0};
  data.categoryStats[q.tag].answered++;if(isCorrect)data.categoryStats[q.tag].correct++;
  if(!data.termStats[q.concept])data.termStats[q.concept]={answered:0,correct:0};
  data.termStats[q.concept].answered++;if(isCorrect)data.termStats[q.concept].correct++;
  data.lastSeen=Date.now();
  saveUserData(data);currentUser=data;
  quizState.results.push({q,isCorrect});
  if(isCorrect)quizState.correct++;
}

function nextQuestion(){quizState.currentIdx++;renderQuestion()}
function endQuiz(){quizState.results?.length?showResult():showHome()}

// ═══════════════════════════════════════════════════════════════════════════
// RESULT
// ═══════════════════════════════════════════════════════════════════════════
function showResult(){
  const{results,correct}=quizState;
  const total=results.length,pct=total>0?Math.round((correct/total)*100):0;
  const data=getUserData(currentUser.name);
  const badge=getBadge(data.totalAnswered);
  let emoji='🌱',title='Keep at it!';
  if(pct>=90){emoji='🏆';title='Outstanding!'}else if(pct>=75){emoji='⭐';title='Great work!'}else if(pct>=60){emoji='🔬';title='Good effort!'}else if(pct>=40){emoji='📖';title='Keep studying!'}
  document.getElementById('resultCard').innerHTML=`
    <div class="result-emoji">${emoji}</div>
    <div class="result-title">${title}</div>
    <div class="result-score" style="color:${pct>=75?'var(--green)':pct>=50?'var(--amber)':'var(--red)'}">${pct}%</div>
    <div style="color:var(--muted);font-size:.9rem;margin-bottom:20px">${correct}/${total} correct</div>
    <div class="result-breakdown">
      <div class="rb-row"><span>Correct</span><span style="color:var(--green);font-weight:700">${correct} ✓</span></div>
      <div class="rb-row"><span>Need practice</span><span style="color:var(--red);font-weight:700">${total-correct} ✗</span></div>
      <div class="rb-row"><span>Your badge</span><span>${badge.icon} ${badge.label}</span></div>
      ${data.streak>2?'<div class="rb-row"><span>Streak</span><span class="streak-badge">🔥 '+data.streak+'</span></div>':''}
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;flex-direction:column">
      <button class="btn" onclick="startQuiz('${quizState.category}',10)">Play Again 🔄</button>
      <button class="btn btn-outline" onclick="showHome()">Back to Home</button>
    </div>`;
  showScreen('resultScreen');
}

// ═══════════════════════════════════════════════════════════════════════════
// FLAGS
// ═══════════════════════════════════════════════════════════════════════════
let currentFlagConcept='';
function openFlagModal(concept){
  currentFlagConcept=concept;
  document.getElementById('flagConceptLabel').textContent='Term: '+concept;
  document.getElementById('flagStudentAnswer').value='';
  document.getElementById('flagNote').value='';
  document.getElementById('flagModal').classList.add('open');
}
function closeFlagModal(){document.getElementById('flagModal').classList.remove('open')}

async function submitFlagForm(){
  const flag={id:Date.now(),concept:currentFlagConcept,type:document.getElementById('flagType').value,
    studentAnswer:document.getElementById('flagStudentAnswer').value.trim(),
    note:document.getElementById('flagNote').value.trim(),
    reportedBy:currentUser?.name||'Unknown',nickname:currentUser?.nickname||'',
    timestamp:new Date().toISOString(),status:'pending'};
  saveLocalFlags([...getLocalFlags(),flag]);
  closeFlagModal();
  // Sync to cloud
  try{const rec=await cloudReadAll()||{};rec.flags=rec.flags||[];rec.flags.push(flag);await cloudWriteAll(rec)}catch{}
  const fb=document.getElementById('feedbackBox');
  if(fb)fb.innerHTML+=`<div style="margin-top:8px;font-size:.8rem;color:var(--amber)">&#10003; Report sent to your teacher</div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// TEACHER DASHBOARD
// ═══════════════════════════════════════════════════════════════════════════
function renderTeacher(){
  document.getElementById('teacherContent').innerHTML='<div class="empty-state"><div class="checking-spinner" style="width:32px;height:32px"></div><div style="margin-top:12px">Loading...</div></div>';
  renderTeacherContent();
}

async function renderTeacherContent(){
  // Pull everything from cloud
  const rec=await cloudReadAll()||{};
  const pill=document.getElementById('cloudStatusPill');
  if(cloudOk){pill.className='cloud-pill ok';pill.textContent='☁ Connected'}
  else{pill.className='cloud-pill err';pill.textContent='☁ No cloud'}

  // Merge students
  if(rec.students){const local=getStudents();const merged={...local,...rec.students};saveStudents(merged)}
  if(rec.approvedAnswers)saveApprovedAnswers(rec.approvedAnswers);

  const allStudents=getStudents();
  const tags=[...new Set(QUESTIONS.map(q=>q.tag).filter(Boolean))].sort();
  const list=Object.values(allStudents).sort((a,b)=>(b.totalAnswered||0)-(a.totalAnswered||0));

  // Flags
  const localFlags=getLocalFlags();
  const cloudFlags=rec.flags||[];
  const flagMap={};[...localFlags,...cloudFlags].forEach(f=>{flagMap[f.id]=f});
  const allFlags=Object.values(flagMap).sort((a,b)=>b.id-a.id);
  saveLocalFlags(allFlags);
  const pending=allFlags.filter(f=>f.status==='pending').length;

  const tab=window._teacherTab||'students';

  document.getElementById('teacherContent').innerHTML=`
    <div class="teacher-tab-bar">
      <button class="teacher-tab ${tab==='students'?'active':''}" onclick="setTeacherTab('students')">👥 Students (${list.length})</button>
      <button class="teacher-tab ${tab==='flags'?'active':''}" onclick="setTeacherTab('flags')">🚩 Reports${pending>0?'<span class="badge-count">'+pending+'</span>':''}</button>
      <button class="teacher-tab ${tab==='ranking'?'active':''}" onclick="setTeacherTab('ranking')">🏆 Ranking</button>
    </div>

    <!-- STUDENTS -->
    <div id="tTab-students" style="display:${tab==='students'?'block':'none'}">
      <div class="rag-legend">
        <div class="rag-item"><div class="rag-dot" style="background:var(--green)"></div>Green 75%+</div>
        <div class="rag-item"><div class="rag-dot" style="background:var(--amber)"></div>Amber 50–74%</div>
        <div class="rag-item"><div class="rag-dot" style="background:var(--red)"></div>Red below 50%</div>
      </div>
      ${!list.length?'<div class="empty-state"><div class="es-icon">📊</div><div>'+(cloudOk?'No students yet — share the app link!':'Cloud not connected — check your Vercel setup.')+'</div></div>':
        list.map(s=>{
          const pct=s.totalAnswered>0?Math.round((s.totalCorrect/s.totalAnswered)*100):0;
          const overall=getRAG(s.totalCorrect,s.totalAnswered);
          const badge=getBadge(s.totalAnswered);
          const last=s.lastSeen?new Date(s.lastSeen).toLocaleDateString('en-GB'):'Unknown';
          const catRows=tags.map(tag=>{
            const cs=s.categoryStats?.[tag]||{answered:0,correct:0};
            const rag=getRAG(cs.correct,cs.answered);
            const p=cs.answered>0?Math.round((cs.correct/cs.answered)*100):null;
            return'<div class="tb-cat"><div class="tb-cat-name">'+tag+'</div><div class="tb-cat-val" style="color:'+getRAGColor(rag)+'">'+(p!==null?p+'%':'—')+'</div></div>';
          }).join('');
          return`<div class="teacher-card">
            <div class="teacher-name">${badge.icon} ${s.name} <span style="font-size:.75rem;color:var(--accent2);font-weight:400">(${s.nickname||generateNickname(s.name)})</span>
              <span style="margin-left:auto;font-size:.8rem;color:var(--muted)">Last: ${last}</span>
            </div>
            <div class="teacher-mini-stats">
              <span class="mini-stat" style="background:rgba(124,106,247,.15);color:var(--accent2)">${s.totalAnswered||0} answered</span>
              <span class="mini-stat ${overall==='green'?'ms-green':overall==='amber'?'ms-amber':'ms-red'}">${pct}% accuracy</span>
              <span class="mini-stat" style="background:var(--surface2);color:var(--muted)">🔥 max ${s.maxStreak||0}</span>
            </div>
            <div class="teacher-breakdown">${catRows}</div>
          </div>`;
        }).join('')}
      <div style="margin-top:16px;text-align:center"><button class="btn btn-outline btn-sm" onclick="renderTeacherContent()">🔄 Refresh</button></div>
    </div>

    <!-- FLAGS -->
    <div id="tTab-flags" style="display:${tab==='flags'?'block':'none'}">
      ${!allFlags.length?'<div class="empty-state"><div class="es-icon">🚩</div><div>No reports yet</div></div>':
        allFlags.map(f=>{
          const q=QUESTIONS.find(q=>q.concept===f.concept);
          const defn=q?q.definition:'';
          const statusColor=f.status==='approved'?'var(--green)':f.status==='dismissed'?'var(--muted)':'var(--amber)';
          const statusLabel=f.status==='approved'?'✅ Approved':f.status==='dismissed'?'Dismissed':'⏳ Pending';
          const typeLabels={unclear:'Question unclear',wrong_answer:'Answer marked wrong',bad_definition:'Bad definition',other:'Other'};
          return`<div class="flag-card ${f.status!=='pending'?'resolved':''}">
            <div style="font-weight:700;margin-bottom:4px">${f.concept} <span style="float:right;font-size:.75rem;color:${statusColor}">${statusLabel}</span></div>
            <div style="font-size:.75rem;color:var(--muted);margin-bottom:10px">${typeLabels[f.type]||f.type} · ${f.nickname||f.reportedBy} · ${new Date(f.timestamp).toLocaleDateString('en-GB')}</div>
            ${f.studentAnswer?'<div class="flag-answer">Student wrote: "'+f.studentAnswer+'"</div>':''}
            ${f.note?'<div style="font-size:.8rem;color:var(--muted);margin-bottom:10px">Note: '+f.note+'</div>':''}
            ${defn?'<div style="font-size:.8rem;color:var(--muted);margin-bottom:10px;padding:8px;background:var(--surface2);border-radius:8px">Current definition: '+defn+'</div>':''}
            ${f.status==='pending'?
              '<textarea class="flag-edit" id="flagEdit_'+f.id+'" placeholder="Edit or confirm the approved answer before saving...">'+(f.studentAnswer||'')+'</textarea>'+
              '<div class="flag-actions"><button class="btn btn-sm" onclick="approveFlag('+f.id+')" style="flex:1">✅ Approve Answer</button><button class="btn btn-outline btn-sm" onclick="dismissFlag('+f.id+')">Dismiss</button></div>'
              :''}
          </div>`;
        }).join('')}
    </div>

    <!-- RANKING -->
    <div id="tTab-ranking" style="display:${tab==='ranking'?'block':'none'}">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:16px">Real names shown here — students see animal names only</div>
      ${!list.length?'<div class="empty-state"><div class="es-icon">📊</div><div>No students yet</div></div>':
        list.filter(s=>s.totalAnswered>0).sort((a,b)=>{
          const pa=Math.round((a.totalCorrect/a.totalAnswered)*100),pb=Math.round((b.totalCorrect/b.totalAnswered)*100);
          return pb-pa||b.totalAnswered-a.totalAnswered;
        }).map((s,i)=>{
          const ri=['🥇','🥈','🥉'];
          const badge=getBadge(s.totalAnswered||0);
          const pct=Math.round((s.totalCorrect/s.totalAnswered)*100);
          const col=pct>=75?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
          return`<div class="lb-row">
            <div class="lb-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${ri[i]||(i+1)}</div>
            <div class="lb-name">${s.name}<span style="display:block;font-size:.75rem;color:var(--accent2);font-weight:400">${s.nickname||generateNickname(s.name)}</span></div>
            <div class="lb-badge">${badge.icon}</div>
            <div class="lb-score"><div class="lb-pct" style="color:${col}">${pct}%</div><div class="lb-detail">${s.totalAnswered} answered</div></div>
          </div>`;
        }).join('')}
    </div>`;
}

function setTeacherTab(tab){
  window._teacherTab=tab;
  ['students','flags','ranking'].forEach(t=>{
    const el=document.getElementById('tTab-'+t);
    if(el)el.style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.teacher-tab').forEach(btn=>{
    btn.classList.toggle('active',btn.textContent.toLowerCase().includes(tab.slice(0,4)));
  });
}

async function approveFlag(flagId){
  const editEl=document.getElementById('flagEdit_'+flagId);
  const approved=editEl?editEl.value.trim():'';
  if(!approved){alert('Please write or confirm the approved answer first.');return}
  const localFlags=getLocalFlags();
  const flag=localFlags.find(f=>f.id===flagId);
  const concept=flag?flag.concept:'';
  const approvedAnswers=getApprovedAnswers();
  if(!approvedAnswers[concept])approvedAnswers[concept]=[];
  if(!approvedAnswers[concept].includes(approved))approvedAnswers[concept].push(approved);
  saveApprovedAnswers(approvedAnswers);
  saveLocalFlags(localFlags.map(f=>f.id===flagId?{...f,status:'approved'}:f));
  try{
    const rec=await cloudReadAll()||{};
    rec.flags=(rec.flags||[]).map(f=>f.id===flagId?{...f,status:'approved'}:f);
    rec.approvedAnswers=approvedAnswers;
    await cloudWriteAll(rec);
  }catch{}
  renderTeacherContent();
}

async function dismissFlag(flagId){
  const localFlags=getLocalFlags();
  saveLocalFlags(localFlags.map(f=>f.id===flagId?{...f,status:'dismissed'}:f));
  try{
    const rec=await cloudReadAll()||{};
    rec.flags=(rec.flags||[]).map(f=>f.id===flagId?{...f,status:'dismissed'}:f);
    await cloudWriteAll(rec);
  }catch{}
  renderTeacherContent();
}
</script>
