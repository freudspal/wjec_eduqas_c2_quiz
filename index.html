<!DOCTYPE html>
<html lang="en">
<script defer src="/_vercel/insights/script.js"></script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>PsychQuiz — A-Level Psychology</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap');
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--border:#2a2a3e;--text:#e8e8f0;--muted:#6b6b85;--accent:#7c6af7;--accent2:#a78bfa;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--green-dim:rgba(34,197,94,0.15);--amber-dim:rgba(245,158,11,0.15);--red-dim:rgba(239,68,68,0.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:1000;flex-direction:column;gap:16px}
.loading-logo{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--accent2)}
.loading-bar{width:200px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-bar-fill{height:100%;background:var(--accent);border-radius:2px;animation:load 1.5s ease-in-out infinite}
@keyframes load{0%{width:0%}50%{width:100%}100%{width:0%}}

/* CARDS & LAYOUT */
.app-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.app-logo{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--accent2)}
.app-logo span{color:var(--muted);font-style:italic;font-size:.9rem}

/* LOGIN */
#loginScreen{align-items:center;justify-content:center;padding:24px 20px;background:radial-gradient(ellipse at 30% 20%,rgba(124,106,247,.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(167,139,250,.08) 0%,transparent 60%),var(--bg)}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 32px}
.login-title{font-family:'DM Serif Display',serif;font-size:2.4rem;line-height:1.1;margin-bottom:8px;background:linear-gradient(135deg,#fff 0%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-sub{color:var(--muted);margin-bottom:32px;font-size:.95rem}
.form-group{margin-bottom:20px}
.form-label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.form-input{width:100%;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:1rem;transition:border-color .2s;outline:none}
.form-input:focus{border-color:var(--accent)}
.form-input::placeholder{color:var(--muted)}
.btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.btn:hover{background:var(--accent2);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);background:rgba(124,106,247,.1)}
.btn-sm{width:auto;padding:10px 20px;font-size:.9rem}
.btn-danger{background:var(--red);border-color:var(--red)}
.btn-danger:hover{background:#dc2626}

/* HOME */
.home-content{flex:1;padding:24px 20px;overflow-y:auto}
.welcome-banner{background:linear-gradient(135deg,rgba(124,106,247,.2),rgba(167,139,250,.1));border:1px solid rgba(124,106,247,.3);border-radius:16px;padding:20px;margin-bottom:24px}
.welcome-name{font-family:'DM Serif Display',serif;font-size:1.5rem;margin-bottom:4px}
.welcome-sub{color:var(--muted);font-size:.9rem}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 12px;text-align:center}
.stat-num{font-size:1.6rem;font-weight:700;line-height:1}
.stat-label{font-size:.7rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.stat-green .stat-num{color:var(--green)}
.stat-amber .stat-num{color:var(--amber)}
.stat-red .stat-num{color:var(--red)}
.section-title{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px}
.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.cat-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.cat-name{font-size:.85rem;font-weight:600;margin-bottom:6px}
.cat-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:6px}
.cat-bar-fill{height:100%;border-radius:2px;transition:width .3s}
.cat-stats{font-size:.7rem;color:var(--muted)}
.cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}

/* PROGRESS RING */
.progress-ring-wrap{text-align:center;margin-bottom:24px}
.progress-ring{width:120px;height:120px}
.ring-track{fill:none;stroke:var(--border);stroke-width:8}
.ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease;transform:rotate(-90deg);transform-origin:center}
.ring-pct{font-family:'DM Serif Display',serif;font-size:1.8rem;fill:var(--text)}
.ring-label{font-size:.65rem;fill:var(--muted)}

/* QUIZ */
.quiz-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.back-btn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-family:inherit;font-size:.85rem;cursor:pointer;flex-shrink:0;transition:all .2s}
.back-btn:hover{border-color:var(--accent)}
.quiz-progress-bar{flex:1;height:6px;background:var(--border);border-radius:3px}
.quiz-progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.quiz-counter{font-size:.8rem;color:var(--muted);flex-shrink:0}
.quiz-tag-badge{background:rgba(124,106,247,.15);border:1px solid rgba(124,106,247,.3);border-radius:20px;padding:4px 12px;font-size:.75rem;color:var(--accent2);flex-shrink:0}
.quiz-content{flex:1;padding:24px 20px;overflow-y:auto}
.q-type-badge{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:4px 10px;border-radius:20px;margin-bottom:16px}
.badge-mc{background:rgba(124,106,247,.15);color:var(--accent2);border:1px solid rgba(124,106,247,.3)}
.badge-tf{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.badge-def{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.badge-scenario{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.badge-reverse{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.3)}
.q-concept{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:8px;line-height:1.2}
.q-instruction{color:var(--muted);font-size:.9rem;margin-bottom:24px}
.q-text{font-size:1.05rem;line-height:1.5;margin-bottom:24px}
.mc-options{display:flex;flex-direction:column;gap:10px}
.mc-option{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;font-size:.95rem}
.mc-option:hover:not(.disabled){border-color:var(--accent);background:rgba(124,106,247,.08)}
.mc-option.correct{border-color:var(--green);background:var(--green-dim)}
.mc-option.wrong{border-color:var(--red);background:var(--red-dim)}
.mc-option.disabled{cursor:default}
.option-letter{width:28px;height:28px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0;transition:all .2s}
.correct .option-letter{background:var(--green);border-color:var(--green);color:#000}
.wrong .option-letter{background:var(--red);border-color:var(--red);color:#fff}
.tf-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf-btn{padding:20px;border-radius:16px;font-size:1rem;font-weight:600;cursor:pointer;border:2px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit;transition:all .2s}
.tf-btn:hover:not(.disabled){transform:translateY(-2px)}
.tf-btn.true-btn:hover:not(.disabled){border-color:var(--green);background:var(--green-dim)}
.tf-btn.false-btn:hover:not(.disabled){border-color:var(--red);background:var(--red-dim)}
.tf-btn.correct{border-color:var(--green);background:var(--green-dim);color:var(--green)}
.tf-btn.wrong{border-color:var(--red);background:var(--red-dim);color:var(--red)}
.text-entry-area{width:100%;min-height:100px;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-family:inherit;font-size:.95rem;resize:vertical;outline:none;transition:border-color .2s;margin-bottom:16px}
.text-entry-area:focus{border-color:var(--accent)}
.feedback-box{border-radius:14px;padding:16px;margin-top:20px;display:none;animation:fadeIn .3s ease}
.feedback-box.correct{background:var(--green-dim);border:1px solid var(--green)}
.feedback-box.wrong{background:var(--red-dim);border:1px solid var(--red)}
.feedback-box.checking{background:rgba(124,106,247,.1);border:1px solid var(--accent)}
.feedback-title{font-weight:700;margin-bottom:6px;font-size:.95rem}
.feedback-correct .feedback-title{color:var(--green)}
.feedback-wrong .feedback-title{color:var(--red)}
.feedback-def{font-size:.9rem;color:var(--muted);line-height:1.5}
.next-btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s;margin-top:16px;display:none}
.next-btn:hover{background:var(--accent2)}
.check-btn{width:100%;padding:15px;background:var(--surface2);border:1px solid var(--accent);border-radius:12px;color:var(--accent2);font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;transition:all .2s}
.check-btn:hover{background:rgba(124,106,247,.15)}
.check-btn:disabled{opacity:.5;cursor:not-allowed}

/* LEADERBOARD */
.lb-content{flex:1;padding:24px 20px;overflow-y:auto}
.lb-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;transition:all .2s}
.lb-row.me{border-color:var(--accent);background:rgba(124,106,247,.08)}
.lb-rank{font-family:'DM Serif Display',serif;font-size:1.3rem;width:30px;flex-shrink:0;text-align:center}
.lb-rank.gold{color:#FFD700}
.lb-rank.silver{color:#C0C0C0}
.lb-rank.bronze{color:#CD7F32}
.lb-name{flex:1;font-weight:600;font-size:.95rem}
.lb-badge{font-size:1rem}
.lb-score{text-align:right}
.lb-pct{font-weight:700;font-size:1.1rem}
.lb-detail{font-size:.7rem;color:var(--muted)}

/* FLAG */
.flag-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 14px;color:var(--muted);font-family:inherit;font-size:.75rem;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:5px;margin-top:12px}
.flag-btn:hover{border-color:var(--amber);color:var(--amber)}

/* TEACHER */
.teacher-content{flex:1;padding:24px 20px;overflow-y:auto}
.teacher-tab-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.teacher-tab{padding:8px 16px;border-radius:20px;font-size:.8rem;font-weight:600;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .2s;font-family:inherit}
.teacher-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.badge-count{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--amber);color:#000;font-size:.65rem;font-weight:700;margin-left:4px}
.teacher-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.teacher-name{font-weight:700;font-size:1rem;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.teacher-mini-stats{display:flex;gap:8px;flex-wrap:wrap}
.mini-stat{padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.ms-green{background:var(--green-dim);color:var(--green)}
.ms-amber{background:var(--amber-dim);color:var(--amber)}
.ms-red{background:var(--red-dim);color:var(--red)}
.teacher-breakdown{margin-top:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tb-cat{font-size:.75rem;padding:6px 10px;border-radius:8px;background:var(--surface2)}
.tb-cat-name{color:var(--muted)}
.tb-cat-val{font-weight:600}
.flag-card{background:var(--surface);border:1px solid var(--amber);border-radius:14px;padding:16px;margin-bottom:12px}
.flag-card.resolved{border-color:var(--border);opacity:.6}
.flag-answer{background:var(--surface2);border-radius:8px;padding:10px;font-size:.85rem;margin-bottom:10px;font-style:italic}
.flag-actions{display:flex;gap:8px;flex-wrap:wrap}
.flag-edit{width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.85rem;margin-bottom:8px;outline:none;resize:vertical}
.flag-edit:focus{border-color:var(--accent)}
.rag-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.rag-item{display:flex;align-items:center;gap:6px;font-size:.8rem}
.rag-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* NAV */
.nav-tabs{display:flex;border-top:1px solid var(--border);background:var(--surface);padding:8px 12px calc(8px + env(safe-area-inset-bottom));position:sticky;bottom:0;z-index:100;gap:4px}
.nav-tab{flex:1;padding:10px 4px;border:none;background:none;color:var(--muted);font-family:inherit;font-size:.7rem;font-weight:600;cursor:pointer;border-radius:10px;transition:all .2s;text-align:center;text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-icon{font-size:1.1rem}
.nav-tab.active{color:var(--accent2);background:rgba(124,106,247,.12)}
.nav-tab:hover:not(.active){color:var(--text)}

/* RESULT */
#resultScreen{align-items:center;justify-content:center;padding:32px 20px;background:radial-gradient(ellipse at center,rgba(124,106,247,.1) 0%,transparent 70%),var(--bg)}
.result-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;text-align:center}
.result-emoji{font-size:4rem;margin-bottom:16px}
.result-title{font-family:'DM Serif Display',serif;font-size:2rem;margin-bottom:8px}
.result-score{font-size:3rem;font-weight:700;margin:16px 0}
.rb-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:.9rem}
.rb-row:last-child{border-bottom:none}
.streak-badge{background:linear-gradient(135deg,#f59e0b,#f97316);color:#000;font-weight:700;font-size:.75rem;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto}
.modal-title{font-family:'DM Serif Display',serif;font-size:1.4rem;margin-bottom:16px}
.modal-close{float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.2rem}

/* SPINNER */
.checking-spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state .es-icon{font-size:3rem;margin-bottom:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.animate-in{animation:fadeIn .3s ease both}

/* CLOUD STATUS PILL */
.cloud-pill{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted);background:var(--surface2)}
.cloud-pill.ok{border-color:rgba(34,197,94,.4);color:var(--green);background:var(--green-dim)}
.cloud-pill.err{border-color:rgba(239,68,68,.4);color:var(--red);background:var(--red-dim)}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-logo">PsychQuiz</div>
  <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  <div style="color:var(--muted);font-size:.85rem">Loading psychology database...</div>
</div>

<!-- ═══ LOGIN ═══════════════════════════════════════════════════════════════ -->
<div class="screen active" id="loginScreen">
  <div class="login-card animate-in">
    <div class="login-title">PsychQuiz</div>
    <div class="login-sub">A-Level Psychology · Component 2</div>
    <div id="loginForm">
      <div class="form-group">
        <label class="form-label">Your Name</label>
        <input type="text" class="form-input" id="studentName" placeholder="e.g. Emma Clarke" autocomplete="name">
      </div>
      <button class="btn" onclick="studentLogin()">Start Studying 🧠</button>
      <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center">
        <button class="btn btn-outline btn-sm" onclick="showTeacherLogin()">🏫 Teacher Access</button>
      </div>
    </div>
    <div id="teacherLoginForm" style="display:none">
      <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:2rem;margin-bottom:8px">🏫</div>
        <div style="font-weight:600;margin-bottom:4px">Teacher Login</div>
        <div style="font-size:.8rem;color:var(--muted)">PIN is verified securely on the server</div>
      </div>
      <div class="form-group">
        <label class="form-label">Teacher PIN</label>
        <input type="password" class="form-input" id="teacherPin" placeholder="Enter PIN" maxlength="8"
               onkeydown="if(event.key==='Enter')teacherLogin()">
      </div>
      <button class="btn" id="teacherLoginBtn" onclick="teacherLogin()">Access Dashboard</button>
      <div style="margin-top:12px;text-align:center">
        <button class="btn btn-outline btn-sm" onclick="showStudentLogin()">← Student Login</button>
      </div>
      <div id="pinError" style="color:var(--red);font-size:.85rem;text-align:center;margin-top:12px;display:none">Incorrect PIN</div>
    </div>
  </div>
</div>

<!-- ═══ HOME ════════════════════════════════════════════════════════════════ -->
<div class="screen" id="homeScreen">
  <div class="app-header">
    <div class="app-logo">PsychQuiz <span>C2</span></div>
    <div id="headerBadge" style="display:flex;align-items:center;gap:8px"></div>
  </div>
  <div class="home-content" id="homeContent"></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('home')" id="tab-home"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-tab" onclick="switchTab('study')" id="tab-study"><span class="nav-icon">📚</span>Study</button>
    <button class="nav-tab" onclick="switchTab('leaderboard')" id="tab-lb"><span class="nav-icon">🏆</span>Ranks</button>
    <button class="nav-tab" onclick="switchTab('profile')" id="tab-profile"><span class="nav-icon">👤</span>Me</button>
  </div>
</div>

<!-- ═══ STUDY ════════════════════════════════════════════════════════════════ -->
<div class="screen" id="studyScreen">
  <div class="app-header"><div class="app-logo">PsychQuiz <span>C2</span></div></div>
  <div style="flex:1;padding:24px 20px;overflow-y:auto" id="studyContent"></div>
  <div class="nav-tabs">
    <button class="nav-tab" onclick="switchTab('home')"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-tab active" onclick="switchTab('study')"><span class="nav-icon">📚</span>Study</button>
    <button class="nav-tab" onclick="switchTab('leaderboard')"><span class="nav-icon">🏆</span>Ranks</button>
    <button class="nav-tab" onclick="switchTab('profile')"><span class="nav-icon">👤</span>Me</button>
  </div>
</div>

<!-- ═══ MODALS ════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="flagModal">
  <div class="modal">
    <div class="modal-title">🚩 Report an Issue <button class="modal-close" onclick="closeFlagModal()">✕</button></div>
    <div style="font-size:.85rem;color:var(--muted);margin-bottom:16px" id="flagConceptLabel"></div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">What's the problem?</label>
      <select class="form-input" id="flagType">
        <option value="unclear">Question is unclear or confusing</option>
        <option value="wrong_answer">My answer was marked wrong but seems correct</option>
        <option value="bad_definition">Definition seems incorrect</option>
        <option value="other">Something else</option>
      </select>
    </div>
    <div class="form-group" style="margin-bottom:12px">
      <label class="form-label">Your answer <span style="color:var(--muted);font-weight:400">(optional — paste it so your teacher can review)</span></label>
      <textarea class="text-entry-area" id="flagStudentAnswer" placeholder="What did you write?" style="min-height:70px;margin:0"></textarea>
    </div>
    <div class="form-group" style="margin-bottom:16px">
      <label class="form-label">Extra details <span style="color:var(--muted);font-weight:400">(optional)</span></label>
      <input type="text" class="form-input" id="flagNote" placeholder="Anything else to tell your teacher?">
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="submitFlagForm()" style="flex:1">Send Report</button>
      <button class="btn btn-outline" onclick="closeFlagModal()" style="width:auto">Cancel</button>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════════════════════════════════════
