<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
    <title>PsychCat Component 2</title>
    <!-- Use relative paths (no leading slash) for Vercel/Local stability -->
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/quiz-engine.js"></script>
    <script src="js/checker.js"></script>
    <script src="js/ui-manager.js"></script>
</head>
<body>
    <div id="timer-box">180s</div>
    
    <!-- SPLASH (Guaranteed to hide via finally block) -->
    <div id="splash" style="position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="font-size:4rem;">😽</div>
        <div style="font-family:'DM Serif Display',serif;font-size:2rem;color:#ff9f43;margin-top:10px;">PsychCat</div>
    </div>

    <!-- LOGIN SCREEN -->
    <div class="screen active" id="loginScreen">
        <div style="padding:40px 20px; text-align:center;">
            <div style="font-size:4rem;">😺</div><h1 class="dm-font">PsychCat</h1>
            <div id="loginStep1" class="card">
                <label for="iName" class="label-tiny">FULL REAL NAME</label>
                <input type="text" id="iName" class="tarea" style="min-height:50px;" placeholder="e.g. Emma Clarke">
                <button class="btn btn-p" id="btnLookup">Continue 🐾</button>
                <button class="btn btn-o" id="btnAdmin" style="margin-top:15px; border:none; font-size:0.8rem;">Admin Access</button>
            </div>
            <div id="loginStep2" class="card" style="display:none; text-align:left;">
                <div id="pinMsg" style="color:var(--ac); margin-bottom:10px; font-weight:700;"></div>
                <label for="iPin" class="label-tiny">ENTER 4-DIGIT PIN</label>
                <input type="password" id="iPin" class="tarea" style="min-height:50px; text-align:center; letter-spacing:10px;" maxlength="4" placeholder="PIN" inputmode="numeric">
                <button class="btn btn-p" id="btnLogin">Sign In 😼</button>
            </div>
        </div>
    </div>

    <!-- HOME DASHBOARD -->
    <div class="screen" id="homeScreen">
        <div class="hdr"><div class="logo">🐾 PsychCat</div><div id="uBadge" style="font-size:1.5rem;">🌱</div></div>
        <div class="hcontent">
            <div class="card" style="background:linear-gradient(135deg,rgba(255,159,67,0.1),transparent);">
                <div id="uNick" style="font-family:'DM Serif Display'; font-size:1.8rem; color:var(--ac);">...</div>
                <div class="pbar-container"><div id="totalPbar" class="pbar-fill"></div></div>
                <div class="flex-between" style="font-size:0.7rem; font-weight:800; color:var(--mu);">
                    <span id="uAccuracy">Accuracy: 0%</span><span id="uAnswered">0 Ans</span>
                </div>
            </div>
            <div class="grid-2">
                <button class="btn btn-p" id="modeQuick">Quick Quiz</button>
                <button class="btn btn-o" id="modeZen">Zen Mode</button>
                <button class="btn btn-o" id="modeTime">Time Trial</button>
                <button class="btn btn-o" id="modeTricky">Focus</button>
            </div>
            <div id="topicGrid" style="display:grid; grid-template-columns:1fr; gap:12px;"></div>
        </div>
        <div class="nav">
            <button class="ntab on" id="navHome">🏠<br>Home</button>
            <button class="ntab" id="navRank">🏆<br>Rank</button>
            <button class="ntab" id="navMe">😼<br>Me</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen">
        <div class="hdr">
            <button id="btnExit" style="background:none; border:none; color:var(--mu); font-weight:700;">✕ EXIT</button>
            <div style="flex:1; margin:0 20px;"><div class="pbar-container"><div id="qPbar" class="pbar-fill"></div></div></div>
            <div id="qCount" style="font-size:0.8rem; font-weight:800;"></div>
        </div>
        <div class="hcontent" id="qContent"></div>
        <div id="qActions" style="padding:20px; background:var(--sf); border-top:1px solid var(--bd); display:flex; flex-direction:column; gap:12px;">
             <button id="btnCheck" class="btn btn-p">Check Answer 😼</button>
             <div class="grid-2">
                <button id="btnSkip" class="btn btn-o">Skip</button>
                <button id="btnNext" class="btn btn-p" style="display:none;">Next →</button>
             </div>
        </div>
    </div>

    <!-- RANK SCREEN -->
    <div class="screen" id="rankScreen">
        <div class="hdr"><div id="rankTitle" class="logo">🏆 Ranks</div><button id="btnCloseRank" style="background:none; border:none; color:var(--ac);">✕</button></div>
        <div class="hcontent" id="rankContent"></div>
        <div class="nav">
            <button class="ntab" id="navHomeRank">🏠<br>Home</button>
            <button class="ntab on" id="navRankRank">🏆<br>Rank</button>
            <button class="ntab" id="navMeRank">😼<br>Me</button>
        </div>
    </div>

    <!-- PROFILE SCREEN -->
    <div class="screen" id="profileScreen">
        <div class="hdr"><div class="logo">😼 Profile</div><button class="btn btn-o btn-s" id="btnLogout">Logout</button></div>
        <div class="hcontent">
            <div class="card">
                <h3 class="dm-font">Your Stats</h3>
                <div class="flex-between py-10 bb-bd"><span>Total Correct</span><b id="pCorrect">0</b></div>
                <div class="flex-between py-10"><span>Total Skipped</span><b id="pSkipped">0</b></div>
            </div>
            <div class="card">
                <label for="changePin" class="label-tiny">NEW 4-DIGIT PIN</label>
                <input type="password" id="changePin" class="f-input" maxlength="4" placeholder="New PIN">
                <button class="btn btn-p btn-s" id="btnUpdatePin" style="margin-top:10px;">Update PIN</button>
            </div>
        </div>
        <div class="nav">
            <button class="ntab" id="navHomeMe">🏠<br>Home</button>
            <button class="ntab" id="navRankMe">🏆<br>Rank</button>
            <button class="ntab on" id="navMeMe">😼<br>Me</button>
        </div>
    </div>

    <script>
    // --- GLOBAL STATE ---
    window.S = null; window.QUESTIONS = []; window.QZ = null; window.APPROVED = {};

    // --- FALLBACK DATA (Prevents crash if API fails) ---
    const FALLBACK_QS = [{concept:"Independent groups design",definition:"Participants take part in one condition only.",tag:"Research Designs"}];

    // --- INITIALIZATION ---
    window.addEventListener('load', async () => {
        // SAFETY: Force hide splash after 3 seconds no matter what
        const forceHide = setTimeout(() => hideSplash(), 3000);

        try {
            // Check if modules loaded
            if (typeof ApiClient === 'undefined') throw new Error("Scripts failed to load (404)");

            const d = await ApiClient.call('GET_QUESTIONS');
            window.QUESTIONS = (d && d.questions) ? d.questions : FALLBACK_QS; 
            window.APPROVED = (d && d.approvedAnswers) ? d.approvedAnswers : {};
        } catch (e) { 
            console.error("Initialization error:", e.message);
            window.QUESTIONS = FALLBACK_QS;
        } finally {
            clearTimeout(forceHide);
            hideSplash();
            setupApp();
        }
    });

    function hideSplash() {
        const s = document.getElementById('splash');
        if(s) s.style.display = 'none';
    }

    // --- EVENT LISTENERS (CSP COMPLIANT) ---
    function setupApp() {
        // Auth
        document.getElementById('btnLookup').addEventListener('click', handleLookup);
        document.getElementById('btnLogin').addEventListener('click', verifyPin);
        document.getElementById('btnAdmin').addEventListener('click', goTeacherAdmin);

        // Nav (Multi-screen support)
        const bindTab = (id, fn) => { const el = document.getElementById(id); if(el) el.addEventListener('click', fn); };
        bindTab('navHome', showHome); bindTab('navRank', goRank); bindTab('navMe', showProfile);
        bindTab('navHomeRank', showHome); bindTab('navRankRank', goRank); bindTab('navMeRank', showProfile);
        bindTab('navHomeMe', showHome); bindTab('navRankMe', goRank); bindTab('navMeMe', showProfile);
        bindTab('btnCloseRank', showHome);

        // Quiz Modes
        document.getElementById('modeQuick').addEventListener('click', () => startQuiz('all'));
        document.getElementById('modeZen').addEventListener('click', () => startQuiz('zen'));
        document.getElementById('modeTime').addEventListener('click', () => startQuiz('time'));
        document.getElementById('modeTricky').addEventListener('click', () => startQuiz('tricky'));

        // Quiz Actions
        document.getElementById('btnCheck').addEventListener('click', handleCheck);
        document.getElementById('btnSkip').addEventListener('click', handleSkip);
        document.getElementById('btnNext').addEventListener('click', handleNext);
        document.getElementById('btnExit').addEventListener('click', exitQuiz);

        // Profile
        document.getElementById('btnLogout').addEventListener('click', () => { localStorage.clear(); location.reload(); });
        document.getElementById('btnUpdatePin').addEventListener('click', updatePin);
    }

    // --- LOGIC ---
    async function handleLookup() {
        const n = document.getElementById('iName').value.trim(); if(!n) return;
        const res = await Auth.lookup(n);
        document.getElementById('loginStep1').style.display='none'; 
        document.getElementById('loginStep2').style.display='block';
        if(res.exists) document.getElementById('pinMsg').textContent = `Hi, ${res.nickname}! PIN:`;
        else document.getElementById('pinMsg').textContent = "New student! Choose a PIN:";
    }

    async function verifyPin() {
        const p = document.getElementById('iPin').value;
        if (!window.S) {
            window.S = { name: document.getElementById('iName').value, pin: p, nickname: Auth.genNick(document.getElementById('iName').value), totalAnswered: 0, totalCorrect: 0, totalSkipped: 0, termStats: {} };
            await ApiClient.call('PUT_STUDENT', { student: window.S });
        }
        if (window.S.pin === p) showHome(); else alert("No.");
    }

    function showHome() { UIManager.showScreen('homeScreen'); UIManager.renderDashboard(); }
    function showProfile() { UIManager.showScreen('profileScreen'); document.getElementById('pCorrect').textContent = window.S.totalCorrect; document.getElementById('pSkipped').textContent = window.S.totalSkipped; }

    function startQuiz(m, t = null) {
        QuizEngine.init(m, t); UIManager.showScreen('quizScreen'); UIManager.renderQuestion();
        if(m === 'time') { 
            let l=180; const el=document.getElementById('timer-box'); el.style.display='block';
            window.QZ.timer = setInterval(() => { l--; el.textContent=l+'s'; if(l<=0) finishQuiz(); }, 1000);
        }
    }

    async function handleCheck() {
        const ans = document.getElementById('qAns').value; if(!ans) return;
        document.getElementById('btnCheck').innerHTML = '<span class="spinner"></span>';
        const res = await Checker.verify(window.QZ.activeTask, ans);
        const fb = document.getElementById('qFeedback'); fb.style.display='block'; fb.className=`fb-box ${res.ok?'ok':'ng'}`;
        fb.innerHTML = `<b>${res.ok?'Correct!':'Incorrect'}</b><span class="fb-res">${window.QZ.activeTask.target}</span>`;
        if(res.ok) window.QZ.score++; window.QZ.results.push({concept:window.QZ.activeTask.q.concept, ok:res.ok});
        document.getElementById('btnCheck').style.display='none'; document.getElementById('btnSkip').style.display='none'; document.getElementById('btnNext').style.display='flex';
    }

    function handleSkip() { window.QZ.results.push({concept:window.QZ.activeTask.q.concept, ok:false, skipped:true}); handleNext(); }
    function handleNext() { if(QuizEngine.next()) { UIManager.renderQuestion(); document.getElementById('btnCheck').style.display='flex'; document.getElementById('btnCheck').innerHTML="Check Answer 😼"; document.getElementById('btnSkip').style.display='flex'; document.getElementById('btnNext').style.display='none'; } else finishQuiz(); }

    async function finishQuiz() {
        if(window.QZ.timer) clearInterval(window.QZ.timer); document.getElementById('timer-box').style.display='none';
        window.QZ.results.forEach(r => {
            window.S.totalAnswered++; if(r.ok) window.S.totalCorrect++; if(r.skipped) window.S.totalSkipped++;
            const st = window.S.termStats[r.concept] || {answered:0, correct:0, skipped:0};
            st.answered++; if(r.ok) st.correct++; if(r.skipped) st.skipped++; window.S.termStats[r.concept] = st;
        });
        await ApiClient.call('PUT_STUDENT', { student: window.S }); showHome();
    }

    async function goRank() {
        UIManager.showScreen('rankScreen');
        const d = await ApiClient.call('GET_ALL');
        const sorted = Object.values(d.students || {}).sort((a,b) => calcAcc(b.totalCorrect, b.totalAnswered, b.totalSkipped) - calcAcc(a.totalCorrect, a.totalAnswered, a.totalSkipped));
        document.getElementById('rankContent').innerHTML = sorted.map((s,i) => `<div class="card flex-between"><span>#${i+1} ${s.nickname}</span><b>${calcAcc(s.totalCorrect, s.totalAnswered, s.totalSkipped)}%</b></div>`).join('');
    }

    async function goTeacherAdmin() {
        const p = prompt("PIN:"); const d = await ApiClient.call('AUTH', { pin: p });
        if (d.ok) {
            UIManager.showScreen('rankScreen'); document.getElementById('rankTitle').textContent = "🦁 Admin";
            const all = await ApiClient.call('GET_ALL');
            document.getElementById('rankContent').innerHTML = Object.values(all.students || {}).map(s => `<div class="card" style="cursor:pointer" id="drill-${s.name.replace(/\s/g, '')}"><b>${s.name}</b> (${s.nickname})<br>Acc: ${calcAcc(s.totalCorrect, s.totalAnswered, s.totalSkipped)}%</div>`).join('');
            Object.values(all.students).forEach(s => {
                const el = document.getElementById(`drill-${s.name.replace(/\s/g, '')}`);
                if(el) el.addEventListener('click', () => drillStudent(s.name));
            });
        }
    }

    async function drillStudent(name) {
        const d = await ApiClient.call('GET_STUDENT', { name });
        const st = d.student;
        let h = `<div class="card" style="border:2px solid var(--ac);"><h3>${st.name} Report</h3><br>`;
        [...new Set(window.QUESTIONS.map(q=>q.tag))].forEach(t=>{
            let c=0, an=0, sk=0; window.QUESTIONS.filter(q=>q.tag===t).forEach(q=>{ const s = st.termStats[q.concept] || {correct:0,answered:0,skipped:0}; c+=s.correct; an+=s.answered; sk+=s.skipped; });
            h += `<div class="flex-between"><span>${t}</span><b>${calcAcc(c,an,sk)}%</b></div>`;
        });
        h += `<button class="btn btn-o btn-s mt-10" id="btnDrillClose">Close</button></div>`;
        document.getElementById('rankContent').insertAdjacentHTML('afterbegin', h);
        document.getElementById('btnDrillClose').addEventListener('click', (e) => e.target.parentElement.remove());
    }

    async function updatePin() {
        const newP = document.getElementById('changePin').value;
        if(newP.length === 4) { window.S.pin = newP; await ApiClient.call('PUT_STUDENT', { student: window.S }); alert("Updated"); }
    }
    function exitQuiz() { if(confirm("Exit?")) { if(window.QZ.timer) clearInterval(window.QZ.timer); document.getElementById('timer-box').style.display='none'; showHome(); } }
    function calcAcc(c, a, s) { const tw = (a||0) + ((s||0)*0.5); return tw===0 ? 0 : Math.round((c/tw)*100); }
    </script>
</body>
</html>
