<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
    <title>PsychCat Component 2</title>

    <!-- 1. LINK TO EXTERNAL CSS -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- 2. LINK TO MODULAR SCRIPTS -->
    <script src="/js/api-client.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/quiz-engine.js"></script>
    <script src="/js/checker.js"></script>
    <script src="/js/ui-manager.js"></script>
</head>
<body>
    <!-- SPLASH SCREEN -->
    <div id="splash" style="position:fixed;inset:0;background:#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
        <div style="font-size:4rem;">😽</div>
        <div style="font-family:'DM Serif Display',serif;font-size:2rem;color:#ff9f43;margin-top:10px;">PsychCat</div>
    </div>

    <!-- LOGIN SCREEN -->
    <div class="screen active" id="loginScreen">
        <div style="padding:40px 20px; text-align:center;">
            <div style="font-size:4rem;">😺</div>
            <div style="font-family:'DM Serif Display',serif; font-size:2.5rem; margin-bottom:30px;">PsychCat</div>
            
            <div id="loginStep1" class="card" style="text-align:left;">
                <label style="font-size:0.65rem; font-weight:800; color:#6b6b85; letter-spacing:1px;">ENTER REAL FULL NAME</label>
                <input type="text" id="iName" class="tarea" style="min-height:50px; margin-top:5px;" placeholder="e.g. Emma Clarke">
                <button class="btn btn-p" onclick="handleLookup()">Continue 🐾</button>
                <button class="btn btn-o" onclick="goTeacherAdmin()" style="margin-top:15px; border:none; font-size:0.75rem;">Teacher Access</button>
            </div>

            <div id="loginNew" class="card" style="display:none; text-align:left;">
                <div style="font-weight:700; color:#ff9f43; margin-bottom:15px;">New student detected!</div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                    <div><label style="font-size:0.6rem;">YEAR</label><select id="sYear" class="f-input"><option value="1">Year 1</option><option value="2">Year 2</option></select></div>
                    <div><label style="font-size:0.6rem;">GROUP</label><select id="sGroup" class="f-input"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select></div>
                    <div><label style="font-size:0.6rem;">TEACHER</label><select id="sTeacher" class="f-input"><option>S</option><option>J</option></select></div>
                </div>
                <label style="font-size:0.6rem; margin-top:10px; display:block;">4-DIGIT PIN</label>
                <input type="password" id="nPin" class="f-input" maxlength="4" style="text-align:center; letter-spacing:10px;" inputmode="numeric">
                <button class="btn btn-p" onclick="createAccount()">Sign Up 😼</button>
            </div>

            <div id="loginPin" class="card" style="display:none; text-align:left;">
                <div id="pinMsg" style="font-weight:700; color:#ff9f43; margin-bottom:10px;"></div>
                <input type="password" id="iPin" class="tarea" style="text-align:center; letter-spacing:10px;" maxlength="4" inputmode="numeric" placeholder="PIN">
                <button class="btn btn-p" onclick="verifyPin()">Sign In 😼</button>
            </div>
        </div>
    </div>

    <!-- HOME DASHBOARD -->
    <div class="screen" id="homeScreen">
        <div class="hdr"><div class="logo">🐾 PsychCat</div><div id="uBadge" style="font-size:1.5rem;">🌱</div></div>
        <div class="hcontent">
            <div class="card" style="background: linear-gradient(135deg, rgba(255,159,67,0.1), transparent);">
                <div id="uNick" style="font-family:'DM Serif Display',serif; font-size:1.8rem; color:#ff9f43;">...</div>
                <div id="uMeta" style="font-size:0.75rem; color:#6b6b85; margin-bottom:12px;">...</div>
                <div class="pbar-container"><div id="totalPbar" class="pbar-fill"></div></div>
                <div style="display:flex; justify-content:space-between; font-size:0.7rem; font-weight:800; color:#6b6b85;">
                    <span id="uAccuracy">Accuracy: 0%</span><span id="uAnswered">0 Answered</span>
                </div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px;">
                <button class="btn btn-p" onclick="startQuiz('all')">🎲 Random Quiz</button>
                <button class="btn btn-o" onclick="startQuiz('tricky')">🔥 Tricky Terms</button>
            </div>
            <div id="topicGrid" style="display:grid; grid-template-columns:1fr; gap:8px;"></div>
        </div>
        <div class="nav">
            <button class="ntab on" onclick="showHome()">🏠<br>Home</button>
            <button class="ntab" onclick="goRank()">🏆<br>Rank</button>
            <button class="ntab" onclick="showProfile()">😼<br>Me</button>
        </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen">
        <div class="hdr">
            <button onclick="exitQuiz()" style="background:none; border:none; color:#6b6b85; font-weight:700;">✕ EXIT</button>
            <div style="flex:1; margin:0 20px;"><div class="pbar-container"><div id="qPbar" class="pbar-fill"></div></div></div>
            <div id="qCount" style="font-size:0.8rem; font-weight:800;">1/10</div>
        </div>
        <div class="hcontent" id="qContent"></div>
        <div id="qActions" style="padding:20px; background:#13131a; border-top:1px solid #2a2a3e; display:flex; flex-direction:column; gap:10px;">
             <button id="btnCheck" class="btn btn-p" onclick="handleCheck()">Check Answer 😼</button>
             <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button id="btnSkip" class="btn btn-o" onclick="handleSkip()">Skip 😿</button>
                <button id="btnNext" class="btn btn-p" style="display:none;" onclick="handleNext()">Next →</button>
             </div>
        </div>
    </div>

    <!-- RANK SCREEN -->
    <div class="screen" id="rankScreen">
        <div class="hdr"><div id="rankTitle" class="logo">🏆 Ranks</div><button onclick="showHome()" style="background:none; border:none; color:#ff9f43;">✕</button></div>
        <div class="hcontent" id="rankContent"></div>
        <div class="nav">
            <button class="ntab" onclick="showHome()">🏠<br>Home</button>
            <button class="ntab on" onclick="goRank()">🏆<br>Rank</button>
            <button class="ntab" onclick="showProfile()">😼<br>Me</button>
        </div>
    </div>

    <!-- PROFILE SCREEN -->
    <div class="screen" id="profileScreen">
        <div class="hdr"><div class="logo">😼 Profile</div><button class="btn btn-o btn-s" onclick="handleSignOut()">Logout</button></div>
        <div class="hcontent">
            <div class="card">
                <h3 style="font-family:'DM Serif Display'; margin-bottom:15px;">Summary</h3>
                <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #2a2a3e;"><span>Correct</span><b id="pCorrect">0</b></div>
                <div style="display:flex; justify-content:space-between; padding:8px 0;"><span>Skipped</span><b id="pSkipped">0</b></div>
            </div>
            <div class="card">
                <input type="password" id="changePin" class="f-input" maxlength="4" placeholder="New PIN">
                <button class="btn btn-p btn-s" onclick="updatePin()">Update PIN</button>
            </div>
        </div>
        <div class="nav">
            <button class="ntab" onclick="showHome()">🏠<br>Home</button>
            <button class="ntab" onclick="goRank()">🏆<br>Rank</button>
            <button class="ntab on" onclick="showProfile()">😼<br>Me</button>
        </div>
    </div>

    <!-- MAIN APP SCRIPT -->
    <script>
    window.S = null; window.QUESTIONS = []; window.QZ = null; window.APPROVED = {};

    window.addEventListener('load', async () => {
        try {
            const d = await ApiClient.call('GET_QUESTIONS');
            window.QUESTIONS = d.questions || [];
            window.APPROVED = d.approvedAnswers || {};
        } catch (e) {
            console.error("Load failed", e);
        }
        document.getElementById('splash').style.display = 'none';
    });

    async function handleLookup() {
        const name = document.getElementById('iName').value.trim();
        if (!name) return;
        const res = await Auth.lookup(name);
        document.getElementById('loginStep1').style.display = 'none';
        if (res.exists) {
            document.getElementById('loginPin').style.display = 'block';
            document.getElementById('pinMsg').textContent = `Hi, ${res.nickname}! Enter PIN:`;
        } else {
            document.getElementById('loginNew').style.display = 'block';
        }
    }

    async function verifyPin() {
        if (window.S.pin === document.getElementById('iPin').value) showHome();
        else alert("Wrong PIN");
    }

    async function createAccount() {
        await Auth.signup({
            name: document.getElementById('iName').value.trim(),
            pin: document.getElementById('nPin').value,
            year: document.getElementById('sYear').value,
            group: document.getElementById('sGroup').value,
            teacher: document.getElementById('sTeacher').value
        });
        showHome();
    }

    function showHome() { 
        UIManager.showScreen('homeScreen'); 
        UIManager.renderDashboard(); 
    }

    function showProfile() {
        UIManager.showScreen('profileScreen');
        document.getElementById('pCorrect').textContent = window.S.totalCorrect;
        document.getElementById('pSkipped').textContent = window.S.totalSkipped;
    }

    async function updatePin() {
        const newP = document.getElementById('changePin').value;
        if(newP.length === 4) {
            window.S.pin = newP;
            await ApiClient.call('PUT_STUDENT', { student: window.S });
